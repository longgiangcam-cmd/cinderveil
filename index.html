<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Cinderveil">
<meta name="theme-color" content="#0a0908"><title>CINDERVEIL — Màn Tro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&display=swap&subset=vietnamese" rel="stylesheet">
<style>/* ===================== CINDERVEIL — GIAO DIỆN ===================== */
:root{--bg:#07060a;--panel:#120f12;--panel2:#1a1519;--line:#3b2e2a;--gold:#c9a46a;--gold2:#ecd09a;--goldd:#7a6038;--bone:#ece2d0;--dim:#a09382;--ember:#e8893b;--ember2:#ffb267;--blood:#a3242a;--rose:#e06a95;--violet:#9a6bdc;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
  --fh:"Cormorant Garamond","Cormorant",Baskerville,"Times New Roman",Georgia,serif;--fb:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
  --frame:linear-gradient(135deg,#8a6a3a,#e9cc90 30%,#7a5a2e 55%,#d9b77a 80%,#6a4c26);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font:15px/1.5 var(--fb);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
.serif,h1,h2,h3{font-family:var(--fh);font-weight:700;letter-spacing:.3px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1a1218,#07060a 70%)}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab);overflow:hidden}
.scr.on{display:flex;animation:scrIn .28s ease-out}
@keyframes scrIn{from{opacity:0}to{opacity:1}}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.shade{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(7,6,10,.7),rgba(7,6,10,.2) 35%,rgba(7,6,10,.35) 60%,rgba(7,6,10,.92)),radial-gradient(130% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.7))}
.scr>*:not(.bgimg):not(.shade){position:relative;z-index:1}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.pad{padding:12px 14px}
h1{font-size:44px;margin:0;color:var(--gold2);text-shadow:0 0 22px rgba(232,137,59,.45),0 2px 0 #000;line-height:1}
h2{font-size:26px;margin:4px 0 8px;color:var(--gold2)}
h3{font-size:19px;margin:6px 0 4px;color:var(--gold2)}
.muted{color:var(--dim);font-size:13px}
.orn{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:11px;margin:8px 0}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--goldd),transparent)}
/* nút */
.btn{position:relative;display:block;width:100%;padding:13px 16px;margin:8px 0;background:linear-gradient(180deg,rgba(34,27,26,.94),rgba(17,13,14,.96));border:1px solid var(--line);border-radius:12px;text-align:left;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,220,170,.06),0 4px 14px rgba(0,0,0,.45);transition:transform .12s,border-color .2s}
.btn::before{content:"";position:absolute;left:10px;right:10px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,164,106,.5),transparent)}
.btn:active{transform:scale(.98)}
.btn b{color:var(--bone)}
.btn small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.btn.main{text-align:center;font-family:var(--fh);font-size:21px;font-weight:700;color:#2a1405;border:1px solid #f3c98a;background:linear-gradient(180deg,#ffd08a,#e8893b 55%,#b65a1c);box-shadow:0 0 18px rgba(232,137,59,.35),inset 0 1px 0 rgba(255,255,255,.5);text-shadow:0 1px 0 rgba(255,230,190,.5)}
.btn.main small{color:#4a2408;font-family:var(--fb)}
.btn.hot{border-color:rgba(224,106,149,.7);color:#ffc2d8;box-shadow:0 0 14px rgba(224,106,149,.18),inset 0 1px 0 rgba(255,200,220,.08)}
.btn.dis{opacity:.38;pointer-events:none;filter:grayscale(.6)}
.row{display:flex;gap:8px;align-items:center}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;background:#1a1416;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.ico{width:36px;height:36px;border-radius:10px;border:1px solid var(--goldd);background:linear-gradient(180deg,#231b1a,#120e0f);display:inline-flex;align-items:center;justify-content:center;font-size:16px;color:var(--gold2)}
/* thanh trên */
.top{display:flex;gap:12px;align-items:center;padding:9px 12px;font-size:13px;background:linear-gradient(180deg,rgba(10,8,10,.92),rgba(10,8,10,.7));border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--goldd),transparent) 1}
.top b{color:var(--bone);font-weight:700}.hpc{color:#ff8a7a}.gc{color:var(--gold2)}.sc{color:#9fd0ff}.cc{color:#c79cff}.top .sp{flex:1}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:#5c5145;font-size:11px;background:repeating-linear-gradient(45deg,#0e0b0d,#0e0b0d 8px,#120e11 8px,#120e11 16px);border:1px dashed #3a2e28}
/* tiêu đề */
#title{justify-content:flex-end}
#title .tbox{padding:24px 22px 46px;text-align:center}
#title h1{font-size:54px;letter-spacing:3px}
.ember{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--ember2);box-shadow:0 0 6px var(--ember);opacity:0;animation:rise linear infinite;z-index:1;pointer-events:none;will-change:transform,opacity}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}100%{transform:translate3d(var(--dx),-100vh,0);opacity:0}}
/* sảnh: dải chân dung */
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;margin:6px -2px}
.sp-h{position:relative;flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:4px}
.sp-h img,.sp-h span{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:center 20%;border:2px solid transparent;background:linear-gradient(#120e10,#120e10) padding-box,var(--frame) border-box;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:24px;color:var(--gold2)}
.sp-h i{font-style:normal;font-size:11px;color:var(--dim)}
.sp-h b{position:absolute;top:0;right:2px;color:#fff;background:var(--rose);border-radius:99px;font-size:10px;padding:1px 5px;box-shadow:0 0 8px var(--rose)}
/* bản đồ */
.doors{display:flex;flex-direction:column;gap:12px;padding:12px 14px}
.door{position:relative;display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(100deg,rgba(26,20,20,.95),rgba(14,11,12,.9));border:1px solid var(--line);border-radius:14px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.5);overflow:hidden}
.door::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(201,164,106,.07),transparent 40%);pointer-events:none}
.door:active{transform:scale(.98)}
.door .di{flex:none;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid transparent;background:linear-gradient(#1b1416,#0e0b0c) padding-box,var(--frame) border-box;color:var(--gold2)}
.door b{color:var(--gold2)!important}
.door.hero{border-color:rgba(224,106,149,.6)}.door.hero .di{color:#ff9cc3}
.door.elite{border-color:#7d2626}.door.elite .di{color:#ff7a6b}
.door.boss{border-color:var(--ember);box-shadow:0 0 22px rgba(232,137,59,.25)}
.floorbar{display:flex;gap:5px;padding:6px 14px}
.floorbar i{flex:1;height:6px;border-radius:3px;background:#2a2120}
.floorbar i.on{background:linear-gradient(90deg,#8a5a24,var(--gold))}.floorbar i.cur{background:var(--ember2);box-shadow:0 0 8px var(--ember)}
.relics{display:flex;gap:5px;flex-wrap:wrap;padding:2px 14px}
.relic{font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(30,22,16,.85);border:1px solid var(--goldd);color:var(--gold2)}
/* VN */
#vn{background:#000}
#vn .vimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s;z-index:0;will-change:opacity}
#vn .vimg.on{opacity:1}
#vn.fit .vimg{object-fit:contain}
#vn .vtools{position:absolute;top:calc(var(--sat) + 10px);right:10px;display:flex;gap:6px;z-index:3}
#vn .vbox{position:absolute;left:10px;right:10px;bottom:calc(var(--sab) + 12px);z-index:2;background:linear-gradient(180deg,rgba(14,10,12,.86),rgba(8,6,8,.94));border:1px solid transparent;border-radius:16px;padding:16px 16px 18px;min-height:118px;background-clip:padding-box;box-shadow:0 -10px 40px rgba(0,0,0,.55)}
#vn .vbox::before{content:"";position:absolute;inset:-1px;border-radius:16px;padding:1px;background:var(--frame);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.8}
#vn .vname{position:absolute;top:-14px;left:16px;font-family:var(--fh);font-weight:700;color:#2a1405;font-size:16px;padding:2px 14px;border-radius:8px;background:linear-gradient(180deg,#f3d39a,#c9a46a);box-shadow:0 2px 8px rgba(0,0,0,.6)}
#vn .vname:empty{display:none}
#vn .vtext{font-size:16.5px;line-height:1.6;color:#f2e9da;margin-top:4px}
#vn .vtext.nar{font-family:var(--fh);font-style:italic;font-size:18.5px;color:#e3d3b8}
#vn .vch{margin-top:10px}
#vn .vch .btn{background:linear-gradient(180deg,rgba(40,30,28,.97),rgba(20,15,16,.97))}
#vn.hide .vbox,#vn.hide .vtools .hb{opacity:0;pointer-events:none}
#vn .vnext{position:absolute;right:16px;bottom:8px;color:var(--gold);font-size:12px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
#vn .vslot{position:absolute;left:0;right:0;top:35%;text-align:center;color:#4d4339;font-size:12px;z-index:0}
#vn.ionly .vbox{background:transparent;box-shadow:none;min-height:40px}#vn.ionly .vbox::before,#vn.ionly .vname,#vn.ionly .vtext{display:none}
/* combat */
#combat .enemies{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:10px;min-height:0}
.en{position:relative;flex:1;max-width:47%;display:flex;flex-direction:column;align-items:center;transition:transform .15s,opacity .4s}
#combat .enemies.solo .en{max-width:74%}
.en .ef{width:100%;aspect-ratio:2/3;max-height:36vh;border-radius:14px;overflow:hidden;position:relative;border:2px solid transparent;background:linear-gradient(#0d0a0c,#0d0a0c) padding-box,var(--frame) border-box;box-shadow:0 10px 28px rgba(0,0,0,.65)}
#combat .enemies.solo .ef{max-height:46vh}
.en .ef img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.en .ef::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.55));pointer-events:none}
.en.tg .ef{box-shadow:0 0 0 3px var(--ember2),0 0 26px rgba(232,137,59,.7)}
.en{transition:transform .15s,opacity .6s,filter .6s}.en.dead{opacity:0;transform:translateY(14px) scale(.94);filter:grayscale(1) brightness(.4);pointer-events:none}
.en .intent{position:absolute;top:8px;left:8px;z-index:2;background:rgba(8,6,8,.85);border:1px solid var(--goldd);border-radius:10px;padding:3px 9px;font-weight:800;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.6)}
.en .intent:empty{display:none}
.en .intent.atk{color:#ff8a7a;border-color:#8a2f2a}.en .intent.def{color:#9fd0ff;border-color:#2c4d6b}.en .intent.buf{color:#ffd36e}.en .intent.dbf{color:#c79cff;border-color:#4b3070}
.en .en-n{font-family:var(--fh);font-weight:700;font-size:15px;margin-top:5px;text-align:center;color:var(--gold2);text-shadow:0 1px 3px #000}
.bar{position:relative;width:100%;height:15px;border-radius:8px;background:#200b0d;overflow:hidden;margin-top:4px;border:1px solid #4a1d1d;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(180deg,#e0524c,#8a1a1f);transition:width .3s}
.bar i::after{content:"";position:absolute;left:0;right:0;top:0;height:40%;background:rgba(255,255,255,.18)}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px;font-weight:800;text-shadow:0 1px 2px #000}
.bar.blk{border-color:#5aa0e0;box-shadow:0 0 8px rgba(90,160,224,.5)}
.sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;justify-content:center;min-height:16px}
.st{font-size:11px;padding:0 6px;border-radius:6px;background:rgba(20,15,16,.9);border:1px solid var(--line)}
.st.s{color:#ffb36e}.st.v{color:#ff8ad0}.st.w{color:#b0b0ff}.st.bl{color:#ff6b6b}.st.b{color:#9fd0ff}.st.o{color:#e2d6c2}
.shake{animation:shk .25s}
@keyframes shk{25%{transform:translateX(-7px) rotate(-1deg)}75%{transform:translateX(7px) rotate(1deg)}}
.flt{position:absolute;left:50%;top:30%;transform:translate(-50%,0);font-weight:900;font-size:26px;color:#fff1e6;text-shadow:0 2px 4px #000,0 0 10px #e33;pointer-events:none;animation:flt .85s forwards;z-index:5;font-family:var(--fh)}
.flt.blk{color:#cfe8ff;text-shadow:0 2px 4px #000,0 0 10px #39f}.flt.heal{color:#c6ffc6;text-shadow:0 2px 4px #000,0 0 10px #3c3}
.flt.cname{top:6%;font-size:24px;color:var(--gold2);text-shadow:0 2px 6px #000,0 0 16px rgba(232,137,59,.8);animation:cname .7s forwards;white-space:nowrap}
@keyframes flt{to{transform:translate(-50%,-44px);opacity:0}}
@keyframes cname{0%{transform:translate(-50%,10px) scale(.8);opacity:0}25%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{transform:translate(-50%,-16px);opacity:0}}
#flash{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle,transparent 45%,rgba(200,20,30,.55));opacity:0}
#flash.on{animation:flash .35s}
@keyframes flash{30%{opacity:1}100%{opacity:0}}
.pbar{padding:8px 12px;background:linear-gradient(180deg,rgba(12,9,11,.85),rgba(12,9,11,.95));border-top:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--goldd),transparent) 1}
.pbar .row{gap:10px}
.orb{position:relative;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff0c8,#ffb453 30%,#d2621a 62%,#4a1c06);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;color:#2a1004;flex:none;box-shadow:0 0 16px rgba(232,137,59,.65),inset 0 -3px 6px rgba(0,0,0,.35);border:2px solid #f3c98a;font-family:var(--fh)}
.pbar .bar{height:17px}
.endt{flex:none;padding:9px 12px;font-size:13px;line-height:1.15;border-radius:12px;background:linear-gradient(180deg,#ffd08a,#e8893b 55%,#a54e16);border:1px solid #f3c98a;color:#2a1405;font-weight:800;box-shadow:0 0 12px rgba(232,137,59,.4)}
.hand{position:relative;height:184px;display:flex;justify-content:center;align-items:flex-end;padding:0 6px 8px;background:linear-gradient(180deg,rgba(10,8,10,.7),rgba(6,5,7,.98))}
.hint{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--ember2);pointer-events:none;text-shadow:0 1px 3px #000}
/* lá bài */
.card{position:relative;width:100px;height:154px;flex:none;border-radius:11px;margin:0 -10px;display:flex;flex-direction:column;overflow:hidden;transition:transform .16s;border:2px solid transparent;
  background:linear-gradient(180deg,#2a201c,#151012) padding-box,linear-gradient(160deg,#6b5236,#2a1f18 50%,#6b5236) border-box;box-shadow:0 6px 14px rgba(0,0,0,.7)}
.card.atk{background:linear-gradient(180deg,#2e1a18,#140d0e) padding-box,linear-gradient(160deg,#c0553f,#4a1a14 50%,#a8442f) border-box}
.card.skl{background:linear-gradient(180deg,#18212e,#0c1016) padding-box,linear-gradient(160deg,#5a8ac0,#14243a 50%,#4c79aa) border-box}
.card.pow{background:linear-gradient(180deg,#2b2416,#120f09) padding-box,linear-gradient(160deg,#e2b65a,#4a3814 50%,#c99a3e) border-box}
.card.cur{background:linear-gradient(180deg,#24152a,#120a16) padding-box,linear-gradient(160deg,#8a4aa0,#2a1232 50%,#6a3a80) border-box}
.card.pact{background:linear-gradient(180deg,#331a26,#170b11) padding-box,linear-gradient(160deg,#ff9cc3,#5a1a34 45%,#ffd08a) border-box;box-shadow:0 0 14px rgba(224,106,149,.35),0 6px 14px rgba(0,0,0,.7)}
.card.sel{transform:translateY(-30px) scale(1.1);z-index:5;box-shadow:0 0 0 2px var(--ember2),0 0 24px rgba(232,137,59,.6),0 10px 20px rgba(0,0,0,.8)}
.card.no{filter:grayscale(.75) brightness(.62)}
.card .cc{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff0c8,#ffb453 35%,#c95e15);color:#2a1004;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:2;border:1.5px solid #2a1404;box-shadow:0 0 8px rgba(232,137,59,.6);font-family:var(--fh)}
.card .art{height:58px;background:radial-gradient(circle at 50% 40%,#2a2026,#0c0a0b) center/cover no-repeat;border-bottom:1px solid rgba(201,164,106,.35)}
.card .cn{font-family:var(--fh);font-size:14px;font-weight:700;text-align:center;padding:4px 3px 0;line-height:1.05;color:var(--gold2)}
.card .cn.up{color:#a8f08a}
.card .ct{font-size:8.5px;text-align:center;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-top:1px}
.card .cd{font-size:10.5px;text-align:center;padding:3px 6px;line-height:1.28;color:#efe4d2}
.card::after{content:"";position:absolute;left:50%;bottom:4px;width:16px;height:3px;transform:translateX(-50%);border-radius:2px;background:#6b5f55}
.card.r2::after{background:#5aa0e0;box-shadow:0 0 6px #5aa0e0}.card.r3::after{background:var(--gold2);box-shadow:0 0 8px var(--gold)}.card.r4::after{background:var(--rose);box-shadow:0 0 8px var(--rose)}
.cardgrid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:10px}
.cardgrid .card{margin:0}
.shopi{display:flex;flex-direction:column;align-items:center;gap:5px}
.price{font-size:13px;color:var(--gold2);font-weight:700}
/* modal */
#modal{position:fixed;inset:0;background:rgba(3,2,4,.8);z-index:50;display:none;flex-direction:column;padding:calc(var(--sat) + 10px) 10px calc(var(--sab) + 10px)}
#modal.on{display:flex;animation:scrIn .2s}
#modal .mbox{position:relative;background:linear-gradient(180deg,#181216,#0d0a0c);border-radius:16px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--goldd);box-shadow:0 20px 60px rgba(0,0,0,.8)}
#modal .mh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,var(--goldd),transparent) 1;background:linear-gradient(180deg,rgba(201,164,106,.08),transparent)}
#modal .mh h3{flex:1;margin:0;font-size:22px}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 62px);transform:translateX(-50%);background:linear-gradient(180deg,#221a16,#120e0e);border:1px solid var(--gold);color:var(--gold2);padding:9px 16px;border-radius:12px;z-index:60;font-size:14px;display:none;max-width:88%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.6)}
/* xưởng ảnh / hồi ức / nữ nhân */
.slotrow{border:1px solid var(--line);border-radius:12px;padding:10px;margin:9px 0;background:#120e10;content-visibility:auto;contain-intrinsic-size:120px;border-left:4px solid #3d342d}
.slotrow.st-ok{border-left-color:#4caf50}.slotrow.st-part{border-left-color:#e0a030}.slotrow.st-none{border-left-color:#6b5f55}.slotrow.st-opt{border-left-color:#333}
.slotrow.is-nsfw{background:linear-gradient(90deg,#1d0e15,#120e10 60%)}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-top:8px;min-height:20px}

        {t:"Đe dọa nàng",aff:-8,r:"~Nàng búng tay. Ngươi bỗng thấy lạnh sống lưng."}]},
   {req:15,lines:["Ta cần máu của kẻ đã chết nhiều lần. Của ngươi, chẳng hạn.","~Nàng nghiêng người, ánh mắt tím lướt dọc cổ ngươi."],

   {req:35,lines:["~Morwen mở cuốn sách đen. Những con chữ trườn trên giấy như rắn.","Bên kia trang này là Vực Thẳm. Ta có thể đọc nó — nếu có ai đó giữ ta lại với thế giới này."],
    ch:[{t:"Nắm lấy tay nàng, kéo nàng về",path:"love",aff:10,r:"~Cuốn sách đóng sập. Morwen nhìn ngươi, lần đầu tiên không có nụ cười giễu cợt."},

        {t:"Bỏ đi",aff:-4,stay:1}]}],
  s1:{love:{n:"Bài Học Riêng",lines:["~Ngọn nến cuối cùng trong thư viện. Morwen tháo mũ, mái tóc đen đổ xuống như mực tràn.","Ta đã đọc mọi cuốn sách viết về dục vọng. Chưa cuốn nào đúng cả.","~Nàng kéo ngươi ngã xuống giữa những trang giấy cũ.","Dạy ta đi, Kẻ Tro Tàn. Những điều sách không viết.","~Đến sáng, nàng ghi chép kín ba trang — rồi xé hết, vì có những thứ không nên viết ra."]},
      dark:{n:"Nghi Thức Vực",lines:["~Vòng tròn rune bùng sáng tím quanh hai người.","Vực Thẳm cần một vật chứa. Ta chọn cả hai ta.","~Bóng tối quấn lấy da thịt, và tiếng cười của Morwen vỡ thành những tiếng thở dồn dập.","~Khi ánh rune tắt, ngươi không còn chắc ai đã trói buộc ai."]}},
  s2:{n:"Khế Ước Mực Đen",lines:["Tên ngươi giờ đã được viết trong sách của ta. Không thể xóa được nữa.","~Nàng hôn lên mu bàn tay ngươi, để lại một dấu rune tím."],card:"pact_morw"},
  talk:["Ta đang nghiên cứu ngươi. Đứng yên.","Lò lửa này… nhàm chán. Trừ khi ngươi ở đây.","Muốn nghe một bí mật không? Phải trả giá đấy.","Đừng chết nữa. Ta ghi chép mệt lắm."],
  end:["~Morwen viết lại lịch sử của Kỷ Nguyên mới. Ở chương cuối chỉ có một cái tên — tên ngươi."]},

 elis:{n:"Elise",title:"Nữ Tu Dị Giáo",age:"26",acts:[1,2],

   {req:35,lines:["Tôi đã thề trinh khiết với một vị thần không còn nữa. Lời thề ấy… còn ý nghĩa không?","~Nàng siết chặt tràng hạt, ngước nhìn ngươi."],
    ch:[{t:"Lời thề nên dành cho người còn sống",path:"love",aff:10,relic:"chuoi_hat",r:"~Nàng tháo tràng hạt, đặt vào tay ngươi. 'Vậy… tôi thề với người.'"},

        {t:"Ta không có câu trả lời",aff:-2,stay:1}]}],
  s1:{love:{n:"Lời Nguyện Thầm",lines:["~Elise tháo khăn voan, mái tóc vàng xõa xuống dưới ánh nến.","Tôi không cầu nguyện với thần nữa. Tối nay, tôi cầu nguyện với người.","~Bàn tay nàng run rẩy, nhưng nụ hôn thì không.","~Chiếc áo dòng đen trượt xuống sàn đá, không ai nhặt lên.","Đây là lần đầu tiên tôi thấy được ơn phước thật sự."]},
      dark:{n:"Thánh Lễ Đen",lines:["~Trên bệ thờ đổ nát, Elise tự tay cởi bỏ áo dòng.","Nếu thần thấy được, hãy để ngài thấy hết.","~Tiếng cầu kinh của nàng dần biến thành một thứ ngôn ngữ khác hẳn.","~Những ngọn nến tắt dần, từng ngọn một."]}},

  talk:["Người về rồi! Tôi… tôi đã cầu nguyện cho người.","Tôi may lại áo cho người, nhưng vụng quá…","Đêm qua tôi mơ thấy người. Đừng hỏi là mơ gì!","Ngồi đây với tôi một chút được không?"],
  end:["~Elise lập một ngôi đền nhỏ bên ngọn lửa mới. Nàng không thờ thần nào cả — chỉ thắp nến mỗi đêm ngươi trở về."]},

 mira:{n:"Mira",title:"Nữ Thương Nhân Hồ Ly",age:"28",acts:[1,2,3],shop:1,

  lines:["~Nàng đẩy ngươi ngã xuống đám hoa hồng đen.","Ta sẽ cho ngươi một giấc mơ ngươi không bao giờ quên.","~Thời gian trôi đi như mật ngọt.","~Khi tỉnh dậy, trên cổ tay ngươi hằn một ấn ký hình trái tim."]},

let STAGED = new Set();
function applyStages(){STAGED=new Set(Object.keys(STAGE_PATCH));
  const get=id=>{const m=id.match(/^(\w+)_s1_(love|dark)$/);if(m)return HEROES[m[1]].s1[m[2]];return MON_SCENES[id]||EV_SCENES[id]||DUOS[id];};
  for(const [id,p] of Object.entries(STAGE_PATCH)){const sc=get(id);const L=sc.lines;let out;
    if(p.m==="ok")out=L.map((l,i)=>(i===0?"[p]":i===L.length-1?"[e]":i===L.length-2?"[c]":"[a]")+l);
    else if(p.m==="ins")out=[...L.slice(0,-1).map((l,i)=>(i===0?"[p]":"[a]")+l),"[c]"+p.pk,"[e]"+L[L.length-1]];
    else if(p.m==="app")out=[...L.map((l,i)=>(i===0?"[p]":"[a]")+l),"[c]"+p.pk,"[e]"+p.af];
    else out=[...L.map(l=>"[p]"+l),...p.act.map(l=>"[a]"+l),"[c]"+p.pk,"[e]"+p.af];
    sc.lines=out;}
}

const LORE=[];const BOONS=[];const ACT_STORY={};const BOSS_TALK={};
function addPack(p){
  Object.assign(CARDS,p.cards||{});Object.assign(RELICS,p.relics||{});Object.assign(ENEMIES,p.enemies||{});
  for(const a in (p.pools||{})){const P=p.pools[a];POOLS[a].n.push(...(P.n||[]));POOLS[a].e.push(...(P.e||[]));}
  for(const [k,h] of Object.entries(p.heroes||{})){HEROES[k]=h;if(!HERO_ORDER.includes(k))HERO_ORDER.push(k);}
  EVENTS.push(...(p.events||[]));Object.assign(EV_SCENES,p.evScenes||{});Object.assign(MON_SCENES,p.monScenes||{});
  Object.assign(DUOS,p.duos||{});Object.assign(STAGE_PATCH,p.stages||{});Object.assign(UPGRADES,p.upgrades||{});
  LORE.push(...(p.lore||[]));BOONS.push(...(p.boons||[]));Object.assign(ACT_STORY,p.actStory||{});Object.assign(BOSS_TALK,p.bossTalk||{});
  Object.assign(COMPS,p.comps||{});Object.assign(RUN_CURSES,p.runCurses||{});Object.assign(AFFIXES,p.affixes||{});
  for(const [k,a] of Object.entries(p.arch||{})){ARCH[k]=ARCH[k]||[];ARCH[k].push(...a);}
  for(const [a,b] of Object.entries(p.bosses||{})){const P=POOLS[a];P.b=[].concat(P.b,b);}
  if(p.version)CONTENT.push({v:p.version,notes:p.notes||[]});}
const CONTENT=[];const COMPS={};const ARCH={};const RUN_CURSES={};const AFFIXES={};
function finalizeData(){applyStages();}

   talk:["Con người các ngươi ồn ào quá. …Trừ ngươi.","Ta săn được một con thỏ. Chia cho ngươi một nửa.","Đừng nhìn tai ta! …Được rồi, nhìn một chút thôi.","Lò lửa này ấm hơn ta tưởng."],
   end:["~Từ tro tàn của khu rừng, một mầm xanh nhú lên. Lyra quỳ bên nó, và kéo ngươi quỳ xuống cùng."]},
  tsub:{n:"Tsubaki",title:"Lãng Khách Phương Đông",age:"27",acts:[2,3],
   desc:"Nữ kiếm khách từ phương Đông xa xôi, truy lùng kẻ đã giết sư phụ. Trầm lặng, kỷ luật, uống rượu rất giỏi.",
   tags:"1girl, solo, mature female, adult, tall female, black hair, long hair, high ponytail, red eyes, scar on cheek, kimono, hakama, red scarf, katana, serious",
   env:"red torii, falling petals, ruined temple, lanterns, night",key:"black hair, high ponytail, red eyes, kimono, red scarf, katana",
   ev:[
    {req:0,lines:["~Dưới cánh cổng đỏ đổ nát, một nữ kiếm khách đang nhắm mắt thiền định.","…Ngươi bước đi như kẻ đã chết nhiều lần. Ta là Tsubaki. Rút kiếm, hoặc ngồi xuống."],
     ch:[{t:"Ngồi xuống thiền cùng nàng (+6 HP)",hp:6,aff:8,r:"~Nàng mở một mắt nhìn ngươi, khóe môi hơi nhếch."},
         {t:"Rút kiếm đấu tập (−8 HP)",hp:-8,aff:10,r:"~Một nhát. Ngươi còn chưa kịp thấy nàng rút kiếm. 'Khá hơn ta tưởng.'"},
         {t:"Lặng lẽ đi tiếp",aff:2}]},
    {req:15,lines:["~Tsubaki rót rượu ra hai chén.","Sư phụ ta nói: rượu uống một mình là rượu buồn."],
     ch:[{t:"Uống cùng nàng",aff:10,r:"~Đến chén thứ năm, nàng kể về sư phụ. Đến chén thứ mười, nàng dựa vào vai ngươi."},
         {t:"Hỏi về kẻ thù của nàng",aff:6,r:"Một kẻ mặc áo trắng. Hắn ở dưới Vực Thẳm. Ta sẽ tìm ra."},
         {t:"Từ chối rượu",aff:-2}]},
    {req:35,lines:["Ta đã tìm thấy hắn. Nhưng nếu ta báo thù… ta sẽ chẳng còn lý do gì để sống tiếp.","~Tay nàng siết chặt chuôi kiếm, run run."],
     ch:[{t:"Thì hãy sống vì một lý do mới",path:"love",aff:10,r:"~Nàng tra kiếm vào vỏ, chậm rãi như một lời hứa."},
         {t:"Báo thù đi, rồi để ta lấp chỗ trống",path:"dark",aff:8,corr:10,card:"chem_manh",r:"~Đêm ấy có tiếng kiếm vang dưới Vực Thẳm. Khi trở về, kimono của nàng nhuộm đỏ — và nàng chỉ nhìn ngươi."},
         {t:"Chưa trả lời được",aff:-2,stay:1}]}],
   s1:{love:{n:"Hoa Trà Rơi",lines:["~Dưới cánh cổng đỏ, hoa trà rơi như tuyết.","Kiếm khách không được phép có điểm yếu. Ngươi là điểm yếu của ta.","~Nàng tháo dải băng đỏ, mái tóc đen xõa xuống vai.","Đêm nay, ta không phải kiếm khách."]},
       dark:{n:"Lưỡi Kiếm Đỏ",lines:["~Nàng trở về từ Vực Thẳm, kimono nhuộm máu, đôi mắt đỏ không còn tĩnh lặng.","Báo thù xong rồi. Trong ta chỉ còn trống rỗng. Lấp đầy nó đi.","~Nàng đẩy ngươi xuống sàn đền, thanh kiếm cắm phập ngay bên cạnh."]}},
   s2:{n:"Khế Ước Hoa Trà",lines:["Thanh kiếm của sư phụ… ta trao cho ngươi một nửa linh hồn của nó.","~Nàng khắc một bông hoa trà nhỏ lên chuôi kiếm của ngươi."],card:"pact_tsub"},
   talk:["Ngồi xuống. Uống với ta một chén.","Kiếm của ngươi cùn rồi. Đưa đây ta mài.","Sư phụ ta chắc sẽ thích ngươi. …Hoặc chém ngươi.","Hoa trà quê ta nở vào mùa đông. Giống ngươi."],
   end:["~Tsubaki treo kiếm lên vách, mở một quán rượu nhỏ cạnh ngọn lửa mới. Bàn đầu tiên luôn để dành cho ngươi."]},
 },
 duos:{
  duo_lyra_tsub:{n:"Trăng Và Hoa",h:["lyra","tsub"],env:"red torii, falling petals, moonlight, forest",
   lines:["~Lyra và Tsubaki thi bắn cung và chém hoa dưới trăng, không ai chịu thua ai.","@lyra:Kiếm khách mà cũng biết say à?","@tsub:Elf mà cũng biết đỏ mặt à?","~Cả hai cùng quay sang nhìn ngươi — trọng tài của cuộc thi."]},
  duo_tsub_brun:{n:"Hai Thanh Kiếm",h:["tsub","brun"],env:"training ground, ruined castle, sunset",
   lines:["~Brunhild và Tsubaki đấu kiếm suốt buổi chiều, bất phân thắng bại.","@brun:Kiếm pháp phương Đông… không tệ.","@tsub:Giáp phương Tây… nặng quá. Cởi ra đi.","~Brunhild đỏ mặt. Tsubaki thì không — nàng chỉ nhìn ngươi, rồi nhìn Brunhild."]},
 },
 stages:{
  lyra_s1_love:{m:"app",pk:"~Gió thổi qua tán lá. Lyra bám chặt lấy ngươi, gọi tên ngươi bằng thứ tiếng của rừng.",af:"~Nàng ngủ thiếp trên ngực ngươi, đôi tai nhọn vẫn còn đỏ ửng."},
  lyra_s1_dark:{m:"app",pk:"~Tiếng thở dốc của thợ săn và con mồi hòa làm một giữa rừng đêm.",af:"~Lyra nằm dài trên lá khô, liếm vết xước trên môi, cười như vừa săn được con mồi quý nhất."},
  tsub_s1_love:{m:"app",pk:"~Hơi thở nàng đứt quãng như nhịp kiếm cuối cùng, rồi vỡ òa trong vòng tay ngươi.",af:"~Tsubaki nằm giữa những cánh hoa trà, tóc xõa, mỉm cười lần đầu tiên không chút phòng bị."},
  tsub_s1_dark:{m:"app",pk:"~Như một trận quyết đấu không ai muốn dừng, cho đến khi cả hai cùng gục ngã.",af:"~Nàng nằm trên sàn đền lạnh, tóc rối, nhìn lên trần và cười khẽ: 'Hòa.'"},
  mon_dryad:{m:"ins",pk:"~Cả khu rừng chết khẽ rung lên, như cùng thở dốc với nàng."},
  mon_dullahan:{m:"ins",pk:"~Chiếc đầu trên gối khẽ kêu lên, còn thân thể nàng siết chặt lấy ngươi."},
  mon_vampire:{m:"ins",pk:"~Nến đỏ chập chờn. Nữ bá tước ngửa đầu, răng nanh lấp lánh trong tiếng thở dốc."},
  duo_lyra_tsub:{m:"duo",act:["@tsub:Luật mới: ai khiến hắn gọi tên mình trước thì thắng.","@lyra:…Chấp nhận."],pk:"~Cuộc thi kết thúc bằng một tiếng gọi lẫn lộn hai cái tên.",af:"~Dưới trăng, elf và kiếm khách ngủ tựa lưng vào nhau, cung và kiếm vứt lăn lóc."},
  duo_tsub_brun:{m:"duo",act:["@tsub:Hiệp sĩ, ngươi tiên phong. Ta yểm hộ.","@brun:Đây không phải chiến trận! …Mà thôi, được."],pk:"~Hai chiến binh, một nhịp thở, cùng gục ngã như sau một trận chiến dài.",af:"~Giáp đen và kimono đỏ vứt bừa trên sàn. Hai nàng ngủ say, tay vẫn đặt hờ lên chuôi kiếm."},
 },
 actStory:{
  1:["~Thành Aldrenn từng là kinh đô của ánh sáng. Giờ chỉ còn tro, và những kẻ không chịu chết.","~Đâu đó dưới lòng thành, Ngọn Lửa Đầu Tiên đang hấp hối."],
  2:["~Hầm Mộ Thánh Ornis — nơi các vị thánh được chôn cùng lời cầu nguyện của họ.","~Mùi trầm hương lẫn mùi mục rữa. Có ai đó vẫn đang hát thánh ca dưới kia."],
  3:["~Vực Thẳm không có đáy, chỉ có những giấc mơ chồng lên nhau.","~Ngươi nghe thấy tiếng cười của một người phụ nữ — vừa quen, vừa lạ."],
 },
 bossTalk:{
  gwyndra:["Dừng lại, Kẻ Tro Tàn. Ba trăm năm nay chưa ai qua được cánh cổng này.","Ta không ghét ngươi. Ta chỉ… không còn biết làm gì khác ngoài canh giữ."],
  ornisa:["Con chiên lạc lối… quỳ xuống, để ta ban phước.","~Bà giơ cây trượng. Thứ ánh sáng tỏa ra từ đó đã mục rữa từ lâu."],
  nyx:["Cuối cùng ngươi cũng đến. Ta đã chờ… lâu hơn ngươi tưởng.","Ngươi có biết vì sao ta nuốt ngọn lửa không? Vì ta từng là người giữ nó."],
 },
 lore:[
  "Trước ta, từng có một Người Giữ Lửa khác. Người ta kể nàng ấy đẹp lắm.",
  "Nàng ấy yêu một Kẻ Tro Tàn. Hắn hứa sẽ trở về sau khi thắp lại ngọn lửa.",
  "Hắn đã thắp lửa — bằng chính thân xác mình. Hắn không bao giờ trở về.",
  "Người Giữ Lửa ấy chờ mãi, rồi bắt đầu căm ghét ngọn lửa đã cướp hắn đi.",
  "Một đêm, nàng bước xuống Vực Thẳm và không quay lại. Người ta gọi nàng bằng một cái tên mới…",
  "…Nyx. Giờ ngươi hiểu vì sao ta sợ mỗi lần ngươi đi xuống đó chưa?",
  "Ta không muốn trở thành nàng ấy. Nên lần này… hãy trở về. Dù kết cục là gì.",
 ],

async function processFile(file){
  let bmp;try{bmp=await createImageBitmap(file);}catch(e){const u=URL.createObjectURL(file);const im=new Image();im.src=u;await im.decode();bmp=im;}
  const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
  const mk=(max,type,q)=>{const s=Math.min(1,max/Math.max(W,H));const w=Math.round(W*s),h=Math.round(H*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";g.drawImage(bmp,0,0,w,h);
    return new Promise(r=>c.toBlob(b=>{c.width=c.height=0;r(b);},type,q));};
  // Giữ NGUYÊN file gốc nếu không quá lớn — không nén lại
  const okType=/^image\/(jpeg|png|webp)$/.test(file.type);
  const full=(okType&&Math.max(W,H)<=2600&&file.size<=8e6)?file:await mk(2600,"image/jpeg",.95);
  const th=await mk(640,"image/jpeg",.86);if(bmp.close)bmp.close();return {full,th,w:W,h:H};
}
async function importFiles(slot,files,onp){let n=0;for(const f of files){const {full,th,w,h}=await processFile(f);
  const id=slot+"#"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await DB.put({id,slot,blob:full,w,h,v:2},th);n++;onp&&onp(n,files.length);}}

  const head=new TextEncoder().encode(JSON.stringify({v:1,items}));const len=new Uint32Array([head.length]);
  return new Blob([new TextEncoder().encode("CVPK"),len,head,...blobs],{type:"application/octet-stream"});}
async function importPack(file,onp){const buf=await file.arrayBuffer();const mg=new TextDecoder().decode(buf.slice(0,4));if(mg!=="CVPK")throw "Sai định dạng gói";
  const len=new Uint32Array(buf.slice(4,8))[0];const head=JSON.parse(new TextDecoder().decode(buf.slice(8,8+len)));let off=8+len,n=0;
  for(const it of head.items){const a=new Blob([buf.slice(off,off+it.a)],{type:it.t||"image/jpeg"});off+=it.a;const b=new Blob([buf.slice(off,off+it.b)],{type:"image/jpeg"});off+=it.b;await DB.put({id:it.id,slot:it.slot,blob:a,w:it.w,h:it.h,v:it.v},b);n++;onp&&onp(n,head.items.length);}return n;}

// steps: [{t: dòng chữ hoặc null (chỉ ảnh), id: id ảnh hoặc null}]
function buildSteps(o){const raw=o.lines;const strip=l=>l.replace(/^\[[pace]\]/,"");
  const base=o.staged||(STAGED.has(o.slot)?o.slot:null);
  if(base){const st={p:[],a:[],c:[],e:[]};raw.forEach((l,i)=>{const m=l.match(/^\[([pace])\]/);st[m?m[1]:(i===0?"p":i===raw.length-1?"e":"a")].push(strip(l));});
    const has=["p","a","c","e"].some(k=>DB.ids(base+"_"+k).length);
    if(has){const out=[];let last=null;
      for(const k of ["p","a","c","e"]){const ids=DB.ids(base+"_"+k);const n=Math.max(st[k].length,ids.length);
        for(let i=0;i<n;i++){const id=ids.length?ids[i%ids.length]:last;last=id;out.push({t:i<st[k].length?st[k][i]:null,id});}}
      return {steps:out,slot:base+"_p"};}
    // chưa có ảnh 4 chặng → dùng ô cũ (nếu còn) chia đều
    o={...o,slot:base};}
  let slot=o.slot;if(o.fb&&!DB.ids(slot).length)slot=o.fb;const ids=DB.ids(slot);const n=raw.length;
  return {steps:raw.map((l,i)=>({t:strip(l),id:ids.length?ids[Math.min(ids.length-1,Math.floor(i*ids.length/n))]:null})),slot,empty:!ids.length};}
function vn(o){return new Promise(async res=>{closeModal();show("vn");const sc=$("#vn");sc.classList.remove("hide");sc.classList.remove("ionly");
  const B0=buildSteps(o);const steps=B0.steps,n=steps.length;
  const A=sc.querySelector(".va"),B=sc.querySelector(".vb");let front=A;A.classList.remove("on");B.classList.remove("on");let curId=null;
  const anyImg=steps.some(s=>s.id);
  sc.querySelector(".vslot").textContent=anyImg||!o.slot?"":"[ ô ảnh trống: "+(B0.slot||o.slot)+(STAGED.has(o.staged||o.slot)?"_p / _a / _c / _e":"")+" ]";
  const pre={};const urlOf=id=>pre[id]||(pre[id]=IMG.url(id));
  // tải trước ảnh của 2 bước kế tiếp
  const ahead=i=>{for(let k=i+1;k<=i+2&&k<n;k++)if(steps[k].id)urlOf(steps[k].id).then(u=>{if(u){const im=new Image();im.src=u;im.decode&&im.decode().catch(()=>{});}});};
  async function showImg(id){if(!id||id===curId)return;curId=id;const u=await urlOf(id);const back=front===A?B:A;await IMG.set(back,u);back.classList.add("on");front.classList.remove("on");front=back;}
  let i=0,typing=null;const nm=sc.querySelector(".vname"),tx=sc.querySelector(".vtext"),chd=sc.querySelector(".vch"),nx=sc.querySelector(".vnext");
  function choicesHTML(){chd.innerHTML=o.choices.map((c,j)=>`<button class="btn ${c.hot?"hot":""} ${c.dis?"dis":""}" data-j="${j}">${esc(c.t)}</button>`).join("");
    chd.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();VN=null;res(+b.dataset.j);});}
  function line(){chd.innerHTML="";const S=steps[i];showImg(S.id);ahead(i);
    if(S.t===null){sc.classList.add("ionly");tx._full="";nx.style.display="block";return;}sc.classList.remove("ionly");
    let L=S.t.replace(/\{H\}/g,o.H||"");let spk=o.name||"";if(L[0]==="@"){const k=L.indexOf(":");const hid=L.slice(1,k);spk=HEROES[hid]?HEROES[hid].n:hid;L=L.slice(k+1);}
    const nar=L[0]==="~";const t=nar?L.slice(1):L;
    nm.textContent=nar?(i===0&&o.title?"— "+o.title+" —":""):spk;tx.className="vtext"+(nar?" nar":"");
    nx.style.display="none";
    if(M.set.tw){let k=0;tx.textContent="";clearInterval(typing);typing=setInterval(()=>{k+=2;tx.textContent=t.slice(0,k);if(k>=t.length){clearInterval(typing);typing=null;after();}},16);}else{tx.textContent=t;after();}
    tx._full=t;
    function after(){if(i===n-1&&o.choices)choicesHTML();else nx.style.display="block";}}
  VN={tap(){if(typing){clearInterval(typing);typing=null;tx.textContent=tx._full;if(i===n-1&&o.choices)choicesHTML();else nx.style.display="block";return;}
      if(i===n-1&&o.choices)return;if(i<n-1){i++;line();}else{VN=null;sc.classList.remove("ionly");res(-1);}}};
  line();});}

function startRun(){const avail=HERO_ORDER.filter(h=>COMPS[h]&&(HEROES[h].hub||M.heroes[h].met));let sel=avail.includes(M.lastComp)?M.lastComp:avail[0];const cur=new Set(M.lastCurses||[]);

function beginRun(cp,curses){M.runs++;M.visit++;const max=70+upg("maxhp")*6;

  if(cp==="nyx")R.deck.push(mkCard("duc_vong"));
  if(upg("relic"))gainRelic("rand");R.opts=genOpts();save();runStart();}
async function runStart(){

    const r=await vn({slot:"bg_hub",name:"Seraphine",lines:["Trước khi ngươi đi… hãy nhận lấy một phúc lành của ngọn lửa."],choices:bs.map(b=>({t:b.n+" — "+b.d}))});
    await applyFx(bs[Math.max(0,r)].fx);}

function heroRunAvail(){return HERO_ORDER.filter(h=>!R.heroDone[h]&&heroNext(h,"run"));}
function genOpts(){const f=R.floor+1;if(f===8)return ["boss"];if(f===1)return ["combat","combat"];
  const w=[["combat",40],["event",20],["elite",f>=3?13:0],["rest",f>=3?11:0],["shop",f>=2?9:0],["treasure",4],["hero",heroRunAvail().length?16:0]];
  const cnt=hasRelic("den_long")?3:(Math.random()<.5?2:3),out=[];let guard=0;while(out.length<cnt&&guard++<50){let tot=w.reduce((a,b)=>a+b[1],0),x=Math.random()*tot,t;for(const [k,v] of w){x-=v;if(x<0){t=k;break;}}if(!out.includes(t)||t==="combat"&&out.filter(o=>o==="combat").length<1)out.push(t);}
  if(f===7&&!out.includes("rest"))out[0]="rest";return out;}
async function showMap(){if(ACT_STORY[R.act]&&R.storyAct!==R.act){R.storyAct=R.act;save();await vn({slot:"bg_act"+R.act,title:"Màn "+R.act+" — "+ACTS[R.act],lines:ACT_STORY[R.act]});}
  show("map");const s=$("#map");await bgSet("map","bg_act"+R.act);
  s.querySelector(".mc").innerHTML=topBar()+`<div class="pad" style="padding-bottom:0"><div class="muted">Màn ${R.act}${M.ng?" · NG+"+M.ng:""}</div><h2 style="margin:2px 0">${ACTS[R.act]}</h2></div>
   <div class="floorbar">${[1,2,3,4,5,6,7,8].map(i=>`<i class="${i<=R.floor?"on":""} ${i===R.floor+1?"cur":""}"></i>`).join("")}</div>
   <div class="relics">${R.comp?`<span class="relic" style="border-color:#c34b7a;color:#ff9cc3">♥ ${HEROES[R.comp].n} · ${COMPS[R.comp].n}</span>`:""}${(R.curses||[]).map(k=>`<span class="relic" style="border-color:#7d2626;color:#ff8a7a">☠ ${RUN_CURSES[k].n}</span>`).join("")}${R.relics.map(k=>`<span class="relic">${RELICS[k].n}</span>`).join("")}</div>
   <div class="scroll"><div class="pad muted" style="padding-bottom:0">Tầng ${R.floor+1}/8 — chọn lối đi:</div><div class="doors">${R.opts.map((o,i)=>`<button class="door ${o}" data-i="${i}"><span class="di">${NODE[o][0]}</span><span><b class="serif" style="font-size:18px">${o==="boss"?ENEMIES[R.bosses[R.act]].n.split(" — ")[0]:NODE[o][1]}</b><br><span class="muted">${o==="boss"?(ENEMIES[R.bosses[R.act]].n.split(" — ")[1]||"Chúa Tể"):NODE[o][2]}</span></span></button>`).join("")}</div>

async function abandon(){if(!confirm("Bỏ cuộc hành trình này?"))return;await runEnd(false,true);}
async function nodeDone(){C=null;R.floor++;if(R.floor>=8){R.act++;R.floor=0;if(R.act>3)return;R.hp=Math.min(R.max,R.hp+Math.round(R.max*.3));toast("Tiến vào: "+ACTS[R.act],2200);}

async function enterNode(t){
  if(t==="combat"){const g=pick(POOLS[R.act].n);return combat(g,"n");}
  if(t==="elite")return combat(pick(POOLS[R.act].e),"e");
  if(t==="boss"){const b=R.bosses[R.act];if(BOSS_TALK[b])await vn({slot:"en_"+b,name:ENEMIES[b].n.split(" — ")[0],lines:BOSS_TALK[b]});return combat([b],"b");}

  if(t==="hero"){const av=heroRunAvail();if(!av.length)return doEvent();const h=pick(av);R.heroDone[h]=1;await playHeroEvent(h);return nodeDone();}}
async function doEvent(){const pool=EVENTS.filter(e=>e.acts.includes(R.act));const ev=pick(pool);
  const heroOk=HERO_ORDER.some(h=>M.heroes[h].aff>=40&&M.heroes[h].met);

  const c=ev.ch[res];const r=await applyFx(c.fx);if(r!=="fight")nodeDone();}
async function applyFx(fx){if(!fx)return;let f=fx;if(f.chance)f=Math.random()<f.chance.p?f.chance.a:f.chance.b;
  if(f.gold)R.gold=Math.max(0,R.gold+Math.round(f.gold*(f.gold>0?goldMul():1)));if(f.hp){R.hp=Math.max(1,Math.min(R.max,R.hp+f.hp));}if(f.maxhp){R.max+=f.maxhp;R.hp+=f.maxhp;}
  if(f.healpct)R.hp=Math.min(R.max,R.hp+Math.round(R.max*f.healpct));if(f.corr)addCorr(f.corr);if(f.souls)R.souls+=f.souls;
  if(f.card){const id=f.card==="rand"?rollCard("n"):f.card==="rare"?rollCard("rare"):f.card;R.deck.push(mkCard(id));toast("Nhận thẻ: "+CARDS[id].n);}
  if(f.relic)gainRelic(f.relic);if(f.curse)R.deck.push(mkCard(f.curse));
  if(f.upg){const cs=shuffle(R.deck.filter(c=>!c.up&&CARDS[c.id].up&&CARDS[c.id].t!=="cur")).slice(0,f.upg);cs.forEach(c=>c.up=1);toast("Rèn: "+cs.map(c=>CARDS[c.id].n).join(", "));}
  if(f.strip){for(const k of ["chem","do"]){const i=R.deck.findIndex(c=>c.id===k);if(i>=0)R.deck.splice(i,1);}toast("Đã loại bỏ 1 Chém và 1 Đỡ Đòn");}
  if(f.rmCurse){const i=R.deck.findIndex(c=>CARDS[c.id].t==="cur");if(i>=0){toast("Đã gỡ: "+CARDS[R.deck[i].id].n);R.deck.splice(i,1);}}
  if(f.affAny){const met=HERO_ORDER.filter(h=>M.heroes[h].met);if(met.length)heroAff(pick(met),f.affAny);}
  if(f.msg)await vn({slot:"",lines:["~"+f.msg]});
  if(f.remove)await new Promise(r=>openDeck("Chọn thẻ để loại bỏ",c=>{R.deck.splice(R.deck.indexOf(c),1);r();},null,r));
  if(f.scene){const sc=EV_SCENES[f.scene];let H="",hid=null;if(sc.hero){const c=HERO_ORDER.filter(h=>M.heroes[h].aff>=40&&M.heroes[h].met);hid=pick(c);H=HEROES[hid].n;}
    await vn({slot:f.scene,name:H,title:sc.n,lines:sc.lines,H});M.gal[f.scene]=1;if(hid&&sc.fx.aff)heroAff(hid,sc.fx.aff);await applyFx({...sc.fx,aff:undefined});}
  save();if(f.fight){combat(f.fight,"n");return "fight";}}
async function doRest(){const heal=hasRelic("vm_tro")?0:Math.round(R.max*(.3+.1*upg("rest")+(comp("sera")?.15:0))*(hasCurse("ember")?.5:1));const hs=HERO_ORDER.filter(h=>!R.heroDone[h]&&!HEROES[h].hub&&!HEROES[h].shop&&M.heroes[h].met&&heroNext(h,"run"));

async function doShop(){const mira=M.heroes.mira;if(!mira.met){await playHeroEvent("mira");}

     <div class="cardgrid">${items.map((it,i)=>it.k==="c"&&!it.sold?`<div class="shopi" data-i="${i}">${cardHTML(mkCard(it.id))}<span class="price">◉ ${it.p}</span></div>`:"").join("")}</div>

     <button class="btn ${removed?"dis":""}" id="rmv">Loại bỏ một thẻ — ◉ ${Math.round(75*disc)}</button>

     <button class="btn main" id="leave">Rời đi</button></div></div>`;hydrateArts($("#shop"));
    $("#shop").querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{const it=items[+el.dataset.i];if(R.gold<it.p)return toast("Không đủ vàng!");R.gold-=it.p;it.sold=1;if(it.k==="c"){R.deck.push(mkCard(it.id));toast("Mua: "+CARDS[it.id].n);}else gainRelic(it.id);save();render();});
    $("#rmv").onclick=()=>{const p=Math.round(75*disc);if(R.gold<p)return toast("Không đủ vàng!");openDeck("Chọn thẻ để loại bỏ",c=>{R.gold-=p;R.deck.splice(R.deck.indexOf(c),1);removed=true;save();render();});};

// ---------------- CHỮ KÝ HIỆU ỨNG (mỗi lá / mỗi chiêu một dấu ấn nhỏ) ----------------
function cardVfx(d,fx){if(d.vfx)return d.vfx;const n=d.n.toLowerCase();
  if(d.t==="atk"){if(fx.all)return n.includes("lửa")?"fire":"sweep";if((fx.h||1)>=3)return "multi";if(/lửa|hỏa/.test(n))return "fire";if(fx.bl||fx.sp==="bleedHit")return "bleed";
    if(/đâm|xuyên|tên|dao|nanh/.test(n))return "pierce";if(/đập|khiên|chấn|vai|trảm giáp/.test(n))return "blunt";if(fx.sp==="curseDmg")return "curse";return "slash";}
  if(fx.bl)return "bleed";if(fx.v||fx.w)return "debuff";if(fx.sp==="addCurse")return "curse";if(fx.hp&&!fx.b)return "heal";if(fx.b||fx.th||fx.sp==="dblBlk")return "shield";return "buff";}
const VFX_SND={slash:"hit",multi:"hit",sweep:"hit",pierce:"pierce",blunt:"thud",fire:"fire",bleed:"hit",curse:"curse",debuff:"curse",shield:"block",buff:"buff",heal:"heal"};
const VFX_COL={slash:"#ffe2c4",multi:"#ffe2c4",sweep:"#ffd9a0",pierce:"#dff3ff",blunt:"#ffcf8a",fire:"#ff9a3c",bleed:"#ff4a4a",curse:"#e070ff",debuff:"#b07cff",shield:"#8fd0ff",buff:"#ffd36e",heal:"#9dffb0"};
function vfx(host,type,o={}){if(!host||!SLEEP_MUL)return;const v=document.createElement("i");v.className="vfx v-"+type+(o.pact?" pact":"");
  if(o.rot!==undefined)v.style.setProperty("--r",o.rot+"deg");if(o.col)v.style.setProperty("--c",o.col);host.appendChild(v);setTimeout(()=>v.remove(),o.ms||700);}
function enemyMoveVfx(e,m){const el=enEl(e)?.querySelector(".ef");const pb=$("#combat .pbar");

function canPlay(c){const {d,cost}=cdef(c);return !d.fx.unpl&&cost<=C.energy;}
function needT(c){const {fx}=cdef(c);if(fx.all)return false;return !!(fx.d||fx.v||fx.w||fx.bl||fx.sp)&&C.en.filter(e=>e.hp>0).length>1;}
function onCardTap(c){if(C.busy||!c)return;if(!canPlay(c)){toast(cdef(c).d.fx.unpl?"Không thể dùng lá này":"Không đủ năng lượng");return;}

function floatAt(el,txt,cls="",big=0){if(!el)return;const f=document.createElement("div");f.className="flt "+cls;f.textContent=txt;if(big)f.style.fontSize=(22+Math.min(big,40)*.55)+"px";el.appendChild(f);setTimeout(()=>f.remove(),800);}

function hitEnemy(e,n){if(e.hp<=0)return;let d=n;if(n>0)SFX.play(C.snd||"hit");const hadBlk=e.blk>0;if(e.blk){const a=Math.min(e.blk,d);e.blk-=a;d-=a;}if(hadBlk&&e.blk===0&&n>0){const el0=enEl(e);if(el0)floatAt(el0,"Vỡ Giáp","mname def");}e.hp-=d;const el=enEl(e);

function drawN(n){for(let i=0;i<n;i++){if(!C.draw.length){if(!C.disc.length)break;C.draw=shuffle(C.disc);C.disc=[];}if(C.hand.length>=10)break;C.hand.push(C.draw.pop());}}
// lá bài bay tới mục tiêu rồi đòn mới trúng — tạo nhịp "ra đòn"
function flyCard(c,target,toSelf){const el=$(`#combat .hand .card[data-u="${c.u}"]`);if(!el)return Promise.resolve();const r=el.getBoundingClientRect();

async function playCard(c,target){const {d,fx,cost}=cdef(c);if(cost>C.energy)return;C.busy=true;C.sel=null;SFX.play("card");

  const reps=isAtk&&C.atk===3&&hasRelic("kiem_ba")?2:1;if(reps>1)toast("Kiếm Thứ Ba: kích hoạt 2 lần!");

async function applyCard(c,d,fx,target){const alive=()=>C.en.filter(e=>e.hp>0);const tg=fx.all?alive():[target&&target.hp>0?target:alive()[0]].filter(Boolean);

  floatAt($("#combat .enemies"),d.n+(c.up?"+":""),"cname",0);const cn=$("#combat .enemies .cname:last-child");if(cn)cn.style.color=VFX_COL[vt];
  const onHit=(e,h)=>{const el=enEl(e)?.querySelector(".ef");if(vt==="sweep"||vt==="fire"&&fx.all){if(e===tg[0])vfx($("#combat .enemies"),vt==="fire"?"firewave":"sweep",{pact});}
    else vfx(el,vt==="multi"?"slash":vt,{rot:vt==="multi"?[-35,30,-10,45,-55,15,0][h%7]:undefined,pact});if(pact&&h===0)vfx(el,"petal",{pact});};
  const selfT=["shield","buff","heal","curse"].includes(vt)&&!(fx.v||fx.w||fx.bl||fx.d);if(selfT){vfx($("#combat .pbar"),vt);if(pact)vfx($("#combat .pbar"),"petal");SFX.play(VFX_SND[vt]);}
  if(!fx.d&&!selfT&&(fx.v||fx.w||fx.bl)){for(const e of tg)vfx(enEl(e)?.querySelector(".ef"),fx.bl?"bleed":"debuff");SFX.play(fx.bl?"hit":"curse");}

  let bonus=0;if(d.t==="atk"){if(comp("tsub")&&C.atk>=3)bonus+=3;if(fx.all){if(comp("lyra"))bonus+=2;if(hasRelic("mat_bao"))bonus+=3;}if(fx.sp==="curseDmg")bonus+=curseCount()*fx.pv;}
  const thornBack=e=>{if(d.t==="atk"&&e.affs&&e.affs.includes("thorn")&&e.hp>0)hitPlayer(3);};

    for(let h=0;h<(fx.h||1);h++){for(const e of tg){onHit(e,h);let base=fx.d+bonus;if(fx.sp==="punish"&&(e.st.v||e.st.w))base*=2;hitEnemy(e,calcP(base,e)*(dbl&&h===0?2:1));thornBack(e);if(d.t==="atk"&&hasRelic("moc_xuong")&&e.hp>0)addBleed(e,1);}
      if((fx.h||1)>1){renderCombat();await sleep(130);}}}
  if(fx.sp==="dmgBlk")for(const e of tg){onHit(e,0);hitEnemy(e,Math.max(0,calcP(C.p.blk,e)-(C.p.st.s||0)));thornBack(e);}

  for(const p of ["love","dark"])if(g[hid+"_s1_"+p])out.push(...["p","a","c","e"].map(k=>hid+"_s1_"+p+"_"+k));
  if(g[hid+"_s2"])out.push(hid+"_s2");for(const id in DUOS)if(DUOS[id].h.includes(hid)&&g[id])out.push(...["p","a","c","e"].map(k=>id+"_"+k));
  if(g[hid+"_end"])out.push(hid+"_end");return out;}

function progOf(list){const req=list.filter(s=>!s.opt);const ok=req.filter(s=>slotState(s)==="ok").length;return {ok,tot:req.length,pct:req.length?Math.round(100*ok/req.length):100};}

// đổi thứ tự: thứ tự = sắp theo id, nên đổi id bằng cách ghi lại 2 bản ghi
async function reorder(slot,a,b){const ids=DB.ids(slot);const ia=ids[a],ib=ids[b];if(!ia||!ib)return;
  const ra=await DB.getRec(ia),rb=await DB.getRec(ib),ta=await DB.get(ia,true),tb=await DB.get(ib,true);
  await DB.put({...rb,id:ia,slot},tb);await DB.put({...ra,id:ib,slot},ta);IMG.drop(ia);IMG.drop(ib);}

  $("#vhide").onclick=()=>$("#vn").classList.toggle("hide");$("#vfit").onclick=()=>$("#vn").classList.toggle("fit");
  $("#tstart").onclick=()=>showHub();
  document.addEventListener("gesturestart",e=>e.preventDefault());}
window.addEventListener("load",boot);
