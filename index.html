<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Cinderveil">
<meta name="theme-color" content="#0a0908"><title>CINDERVEIL — Màn Tro</title>
<style>:root{--bg:#0a0908;--panel:#15120f;--line:#3a2f24;--bone:#e2d6c2;--dim:#9a8c78;--ember:#e8893b;--ember2:#ffb267;--blood:#a3242a;--violet:#8d5bd6;--gold:#e0b44c;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--bone);font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.serif,h1,h2,h3{font-family:"Cormorant Garamond",Baskerville,"Times New Roman",Georgia,serif;font-weight:600;letter-spacing:.5px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--sat);padding-bottom:var(--sab);overflow:hidden}
.scr.on{display:flex}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.shade{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,7,6,.55),rgba(8,7,6,.25) 40%,rgba(8,7,6,.85))}
.scr>*:not(.bgimg):not(.shade){position:relative;z-index:1}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.btn{display:block;width:100%;padding:13px 14px;margin:7px 0;background:linear-gradient(#211b15,#16120e);border:1px solid var(--line);border-radius:10px;text-align:left;font-size:15px}
.btn:active{transform:scale(.98);background:#2a221a}
.btn.main{border-color:var(--ember);color:var(--ember2);text-align:center;font-size:17px}
.btn.hot{border-color:#c34b7a;color:#ff9cc3}
.btn.dis{opacity:.4;pointer-events:none}
.btn small{display:block;color:var(--dim);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#1d1813;border:1px solid var(--line);font-size:12px;color:var(--dim)}
.top{display:flex;gap:10px;align-items:center;padding:8px 12px;font-size:13px;background:rgba(10,9,8,.75);border-bottom:1px solid var(--line)}
.top b{color:var(--bone)} .hpc{color:#ff7a6b} .gc{color:var(--gold)} .sc{color:#9fd0ff} .cc{color:#c58cff}
.top .sp{flex:1}
.ico{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#16120e;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.pad{padding:12px 14px}
h1{font-size:40px;margin:0;color:var(--ember2);text-shadow:0 0 18px rgba(232,137,59,.45)}
h2{font-size:24px;margin:6px 0 10px;color:var(--ember2)}
h3{font-size:18px;margin:4px 0;color:var(--bone)}
.muted{color:var(--dim);font-size:13px}
.empty{display:flex;align-items:center;justify-content:center;text-align:center;color:#5c5145;font-size:11px;background:#0f0d0b;border:1px dashed #2e261e}
/* title */
#title{justify-content:flex-end;align-items:stretch}
#title .tbox{padding:24px 20px 40px;text-align:center}
.ember{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--ember2);opacity:0;animation:rise linear infinite;z-index:1;pointer-events:none;will-change:transform,opacity}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}100%{transform:translate3d(var(--dx),-100vh,0);opacity:0}}
/* map */
.doors{display:flex;flex-direction:column;gap:10px;padding:12px}
.door{display:flex;align-items:center;gap:12px;padding:16px 14px;background:rgba(18,15,12,.88);border:1px solid var(--line);border-radius:12px;text-align:left}
.door:active{transform:scale(.98)}
.door .di{font-size:26px;width:40px;text-align:center}
.door.hero{border-color:#c34b7a} .door.elite{border-color:#7d2626} .door.boss{border-color:var(--ember)}
.floorbar{display:flex;gap:4px;padding:6px 12px}
.floorbar i{flex:1;height:5px;border-radius:3px;background:#2a231c}
.floorbar i.on{background:var(--ember)} .floorbar i.cur{background:var(--ember2);box-shadow:0 0 6px var(--ember)}
/* VN */
#vn .vimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;z-index:0;will-change:opacity}
#vn .vimg.on{opacity:1}
#vn.fit .vimg{object-fit:contain}
#vn .vtools{position:absolute;top:calc(var(--sat) + 8px);right:10px;display:flex;gap:6px;z-index:3}
#vn .vbox{position:absolute;left:8px;right:8px;bottom:calc(var(--sab) + 10px);z-index:2;background:rgba(10,8,7,.82);border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;min-height:110px}
#vn .vname{font-family:Baskerville,Georgia,serif;color:var(--ember2);font-size:17px;margin-bottom:4px;min-height:4px}
#vn .vtext{font-size:16px;line-height:1.55}
#vn .vtext.nar{font-style:italic;color:#d6c9b4}
#vn .vch{margin-top:8px}
#vn .vch .btn{background:rgba(25,20,16,.95)}
#vn.hide .vbox,#vn.hide .vtools .hb{opacity:0;pointer-events:none}
#vn .vnext{position:absolute;right:14px;bottom:8px;color:var(--ember);font-size:12px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
#vn .vslot{position:absolute;left:0;right:0;top:35%;text-align:center;color:#4d4339;font-size:12px;z-index:0}
/* combat */
#combat .enemies{flex:1;display:flex;justify-content:center;align-items:flex-end;gap:8px;padding:8px;min-height:0}
.en{position:relative;flex:1;max-width:48%;display:flex;flex-direction:column;align-items:center;transition:transform .15s,opacity .3s}
.en .ef{width:100%;aspect-ratio:2/3;max-height:34vh;border-radius:10px;overflow:hidden;border:1px solid #3a2a22;background:#0d0b09;position:relative}
.en .ef img{width:100%;height:100%;object-fit:cover;display:block}
.en.tg .ef{border-color:var(--ember2);box-shadow:0 0 0 2px var(--ember)}
.en.dead{opacity:0;pointer-events:none}
.en .intent{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);border-radius:8px;padding:2px 7px;font-weight:700;font-size:14px}
.en .intent.atk{color:#ff8a7a}.en .intent.def{color:#8fc7ff}.en .intent.buf{color:#ffd36e}.en .intent.dbf{color:#c58cff}
.en .en-n{font-size:12px;margin-top:3px;text-align:center;color:var(--bone)}
.bar{position:relative;width:100%;height:14px;border-radius:7px;background:#2a0f10;overflow:hidden;margin-top:3px;border:1px solid #431a1a}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a1a1f,#d23a3a);transition:width .25s}
.bar span{position:absolute;inset:0;text-align:center;font-size:10.5px;line-height:13px;font-weight:700;text-shadow:0 1px 2px #000}
.bar.blk{border-color:#5aa0e0}
.sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;justify-content:center;min-height:16px}
.st{font-size:10.5px;padding:0 5px;border-radius:5px;background:#1d1813;border:1px solid var(--line)}
.st.s{color:#ffb36e}.st.v{color:#ff8ad0}.st.w{color:#b0b0ff}.st.bl{color:#ff6b6b}.st.b{color:#8fc7ff}.st.o{color:#d9cfbf}
.shake{animation:shk .25s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flt{position:absolute;left:50%;top:30%;transform:translate(-50%,0);font-weight:800;font-size:22px;color:#ffdfd0;text-shadow:0 2px 4px #000,0 0 8px #d33;pointer-events:none;animation:flt .8s forwards;z-index:5}
.flt.blk{color:#bde0ff;text-shadow:0 2px 4px #000,0 0 8px #39f}.flt.heal{color:#bfffbf;text-shadow:0 2px 4px #000,0 0 8px #3c3}
@keyframes flt{to{transform:translate(-50%,-40px);opacity:0}}
.pbar{padding:6px 10px;background:rgba(10,9,8,.82);border-top:1px solid var(--line)}
.pbar .row{gap:10px}
.orb{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffcf8a,#d26a1e 60%,#5a2508);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#1a0d04;flex:none;box-shadow:0 0 10px rgba(232,137,59,.5)}
.pbar .bar{height:16px}
.hand{position:relative;height:178px;display:flex;justify-content:center;align-items:flex-end;padding:0 6px 6px;background:rgba(10,9,8,.9)}
.hint{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:12px;color:var(--ember2);pointer-events:none}
.card{position:relative;width:100px;height:152px;flex:none;border-radius:10px;background:linear-gradient(#2a221b,#17120e);border:1.5px solid #5b4936;margin:0 -10px;display:flex;flex-direction:column;overflow:hidden;transition:transform .15s;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.card.atk{border-color:#8a3b32}.card.skl{border-color:#3b5f86}.card.pow{border-color:#8a6b2f}.card.cur{border-color:#5b2c6b;background:linear-gradient(#24152a,#140b18)}.card.pact{border-color:#c34b7a;background:linear-gradient(#2e1a24,#170d12)}
.card.sel{transform:translateY(-26px) scale(1.08);z-index:5;box-shadow:0 0 0 2px var(--ember2),0 8px 18px rgba(0,0,0,.8)}
.card.no{filter:grayscale(.7) brightness(.7)}
.card .cc{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffcf8a,#c95e15);color:#1a0d04;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:2;border:1px solid #000}
.card .art{height:56px;background:#0e0c0a center/cover no-repeat;border-bottom:1px solid #00000080}
.card .cn{font-size:12px;font-weight:700;text-align:center;padding:3px 3px 0;line-height:1.15}
.card .cn.up{color:#9fe07a}
.card .ct{font-size:9px;text-align:center;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.card .cd{font-size:10.5px;text-align:center;padding:2px 5px;line-height:1.25;color:#e8dccb}
.cardgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:10px}
.cardgrid .card{margin:0}
.endt{flex:none;padding:8px 10px;font-size:13px;line-height:1.1;border-radius:10px;background:linear-gradient(#5a2a10,#2c1407);border:1px solid var(--ember);color:var(--ember2);font-weight:700;z-index:6}
.pile{position:absolute;top:-44px;font-size:12px;color:var(--dim);background:rgba(0,0,0,.6);padding:4px 8px;border-radius:8px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:none;flex-direction:column;padding:calc(var(--sat) + 10px) 10px calc(var(--sab) + 10px)}
#modal.on{display:flex}
#modal .mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#modal .mh{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
#modal .mh h3{flex:1}
#toast{position:fixed;left:50%;top:calc(var(--sat) + 60px);transform:translateX(-50%);background:rgba(20,16,12,.95);border:1px solid var(--ember);padding:8px 14px;border-radius:10px;z-index:60;font-size:14px;display:none;max-width:88%;text-align:center}
/* studio / gallery */
.slotrow{border:1px solid var(--line);border-radius:10px;padding:8px;margin:8px 0;background:#120f0c;content-visibility:auto;contain-intrinsic-size:110px}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-top:6px;min-height:20px}
.thumbs img,.thumbs .th{width:56px;height:84px;object-fit:cover;border-radius:6px;flex:none;background:#0d0b09}
.grp{position:sticky;top:0;background:var(--panel);padding:8px 2px;color:var(--ember2);font-family:Baskerville,Georgia,serif;font-size:17px;z-index:2;border-bottom:1px solid var(--line)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.gal .gi{aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative;background:#0e0c0a}
.gal .gi img{width:100%;height:100%;object-fit:cover}
.gal .gi span{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;padding:3px;background:rgba(0,0,0,.7);text-align:center}
.hcard{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(18,15,12,.92);margin:8px 0;align-items:center}
.hcard .hp{width:62px;height:93px;border-radius:8px;overflow:hidden;flex:none}
.hcard .hp img{width:100%;height:100%;object-fit:cover}
.aff{height:6px;border-radius:3px;background:#2a1a20;overflow:hidden;margin-top:4px}
.aff i{display:block;height:100%;background:linear-gradient(90deg,#a3245a,#ff7fb0)}
textarea{width:100%;background:#0d0b09;color:var(--bone);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
.relics{display:flex;gap:4px;flex-wrap:wrap;padding:4px 12px}
.relic{font-size:11px;padding:2px 7px;border-radius:6px;background:#1d1813;border:1px solid #5b4936;color:var(--gold)}
#died{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
#died h1{color:#b3141c;font-size:52px;text-shadow:0 0 20px #000;letter-spacing:6px;animation:fadein 2s}
@keyframes fadein{from{opacity:0;letter-spacing:20px}}
.shopi{display:flex;flex-direction:column;align-items:center;gap:4px}
.price{font-size:13px;color:var(--gold)}
</style></head><body>

 <section class="scr" id="title"><img class="bgimg" alt=""><div class="shade"></div>
  <div class="tbox"><div class="muted" style="letter-spacing:4px">ROGUELITE THẺ BÀI · 18+</div><h1 class="serif">CINDERVEIL</h1><div class="serif" style="font-size:18px;color:var(--dim);margin-bottom:24px">Màn Tro</div>

<script>
// ===================== CINDERVEIL — DATA =====================

  end:["~Brunhild đứng gác bên ngọn lửa mới — không còn là Kẻ Rỗng, chỉ là một người đàn bà đã chọn ở lại.","Ta không thề với ngai vàng nữa. Ta thề với ngươi."]},

 morw:{n:"Morwen",title:"Phù Thủy Vực Thẳm",age:"31",acts:[2,3],
  desc:"Học giả cấm thuật, đổi tri thức lấy những thứ 'thú vị'. Quyến rũ, nguy hiểm, tò mò vô đáy.",
  tags:"1girl, solo, "+ADULT+", black hair, very long hair, purple eyes, mole under eye, witch hat, black dress, corset, long sleeves, glowing runes, staff, smirk, dark aura",

    ch:[{t:"Đổi 40 vàng lấy một phép hiếm",need:{gold:40},gold:-40,card:"rare",aff:5},

        {t:"Đe dọa nàng",aff:-8,r:"~Nàng búng tay. Ngươi bỗng thấy lạnh sống lưng."}]},
   {req:15,lines:["Ta cần máu của kẻ đã chết nhiều lần. Của ngươi, chẳng hạn.","~Nàng nghiêng người, ánh mắt tím lướt dọc cổ ngươi."],

   {req:35,lines:["~Morwen mở cuốn sách đen. Những con chữ trườn trên giấy như rắn.","Bên kia trang này là Vực Thẳm. Ta có thể đọc nó — nếu có ai đó giữ ta lại với thế giới này."],
    ch:[{t:"Nắm lấy tay nàng, kéo nàng về",path:"love",aff:10,r:"~Cuốn sách đóng sập. Morwen nhìn ngươi, lần đầu tiên không có nụ cười giễu cợt."},
        {t:"Cùng nàng đọc trang sách",path:"dark",aff:8,corr:12,relic:"kinh_vuc",r:"Phải rồi… cùng nhau rơi xuống mới thú vị."},
        {t:"Bỏ đi",aff:-4,stay:1}]}],
  s1:{love:{n:"Bài Học Riêng",lines:["~Ngọn nến cuối cùng trong thư viện. Morwen tháo mũ, mái tóc đen đổ xuống như mực tràn.","Ta đã đọc mọi cuốn sách viết về dục vọng. Chưa cuốn nào đúng cả.","~Nàng kéo ngươi ngã xuống giữa những trang giấy cũ.","Dạy ta đi, Kẻ Tro Tàn. Những điều sách không viết.","~Đến sáng, nàng ghi chép kín ba trang — rồi xé hết, vì có những thứ không nên viết ra."]},
      dark:{n:"Nghi Thức Vực",lines:["~Vòng tròn rune bùng sáng tím quanh hai người.","Vực Thẳm cần một vật chứa. Ta chọn cả hai ta.","~Bóng tối quấn lấy da thịt, và tiếng cười của Morwen vỡ thành những tiếng thở dồn dập.","~Khi ánh rune tắt, ngươi không còn chắc ai đã trói buộc ai."]}},
  s2:{n:"Khế Ước Mực Đen",lines:["Tên ngươi giờ đã được viết trong sách của ta. Không thể xóa được nữa.","~Nàng hôn lên mu bàn tay ngươi, để lại một dấu rune tím."],card:"pact_morw"},
  talk:["Ta đang nghiên cứu ngươi. Đứng yên.","Lò lửa này… nhàm chán. Trừ khi ngươi ở đây.","Muốn nghe một bí mật không? Phải trả giá đấy.","Đừng chết nữa. Ta ghi chép mệt lắm."],
  end:["~Morwen viết lại lịch sử của Kỷ Nguyên mới. Ở chương cuối chỉ có một cái tên — tên ngươi."]},

 elis:{n:"Elise",title:"Nữ Tu Dị Giáo",age:"26",acts:[1,2],

        {t:"Cười nhạo vị thần đã chết",aff:-5,corr:3,r:"~Nàng tái mặt… nhưng không phản bác."}]},

        {t:"Giật lấy cuốn sách và đốt",aff:-5}]},
   {req:35,lines:["Tôi đã thề trinh khiết với một vị thần không còn nữa. Lời thề ấy… còn ý nghĩa không?","~Nàng siết chặt tràng hạt, ngước nhìn ngươi."],
    ch:[{t:"Lời thề nên dành cho người còn sống",path:"love",aff:10,relic:"chuoi_hat",r:"~Nàng tháo tràng hạt, đặt vào tay ngươi. 'Vậy… tôi thề với người.'"},

        {t:"Ta không có câu trả lời",aff:-2,stay:1}]}],
  s1:{love:{n:"Lời Nguyện Thầm",lines:["~Elise tháo khăn voan, mái tóc vàng xõa xuống dưới ánh nến.","Tôi không cầu nguyện với thần nữa. Tối nay, tôi cầu nguyện với người.","~Bàn tay nàng run rẩy, nhưng nụ hôn thì không.","~Chiếc áo dòng đen trượt xuống sàn đá, không ai nhặt lên.","Đây là lần đầu tiên tôi thấy được ơn phước thật sự."]},
      dark:{n:"Thánh Lễ Đen",lines:["~Trên bệ thờ đổ nát, Elise tự tay cởi bỏ áo dòng.","Nếu thần thấy được, hãy để ngài thấy hết.","~Tiếng cầu kinh của nàng dần biến thành một thứ ngôn ngữ khác hẳn.","~Những ngọn nến tắt dần, từng ngọn một."]}},

  talk:["Người về rồi! Tôi… tôi đã cầu nguyện cho người.","Tôi may lại áo cho người, nhưng vụng quá…","Đêm qua tôi mơ thấy người. Đừng hỏi là mơ gì!","Ngồi đây với tôi một chút được không?"],
  end:["~Elise lập một ngôi đền nhỏ bên ngọn lửa mới. Nàng không thờ thần nào cả — chỉ thắp nến mỗi đêm ngươi trở về."]},

 mira:{n:"Mira",title:"Nữ Thương Nhân Hồ Ly",age:"28",acts:[1,2,3],shop:1,

    r.onupgradeneeded=()=>{const d=r.result;const s=d.createObjectStore("img",{keyPath:"id"});s.createIndex("slot","slot");d.createObjectStore("thumb",{keyPath:"id"});};
    r.onsuccess=()=>{DB.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  tx(st,m="readonly"){return DB.db.transaction(st,m).objectStore(st);},
  async loadIndex(){DB.idx.clear();await new Promise(res=>{const c=DB.tx("img").index("slot").openKeyCursor();
    c.onsuccess=()=>{const cur=c.result;if(!cur)return res();const s=cur.key;if(!DB.idx.has(s))DB.idx.set(s,[]);DB.idx.get(s).push(cur.primaryKey);cur.continue();};c.onerror=()=>res();});
    for(const a of DB.idx.values())a.sort();},
  ids(slot){return DB.idx.get(slot)||[];},
  put(rec,th){return new Promise((res,rej)=>{const t=DB.db.transaction(["img","thumb"],"readwrite");t.objectStore("img").put(rec);t.objectStore("thumb").put({id:rec.id,blob:th});t.oncomplete=()=>{if(!DB.idx.has(rec.slot))DB.idx.set(rec.slot,[]);const a=DB.idx.get(rec.slot);if(!a.includes(rec.id))a.push(rec.id);a.sort();res();};t.onerror=()=>rej(t.error);});},
  get(id,thumb){return new Promise(res=>{const r=DB.tx(thumb?"thumb":"img").get(id);r.onsuccess=()=>res(r.result&&r.result.blob);r.onerror=()=>res(null);});},
  getRec(id){return new Promise(res=>{const r=DB.tx("img").get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);});},
  del(id){return new Promise(res=>{const t=DB.db.transaction(["img","thumb"],"readwrite");t.objectStore("img").delete(id);t.objectStore("thumb").delete(id);t.oncomplete=()=>{for(const a of DB.idx.values()){const i=a.indexOf(id);if(i>=0)a.splice(i,1);}IMG.drop(id);res();};});},
};
const IMG={cache:new Map(),max:48,
  async url(id,thumb){const k=(thumb?"t:":"f:")+id;if(this.cache.has(k)){const u=this.cache.get(k);this.cache.delete(k);this.cache.set(k,u);return u;}
    const b=await DB.get(id,thumb);if(!b)return null;const u=URL.createObjectURL(b);this.cache.set(k,u);
    while(this.cache.size>this.max){const [ok,ou]=this.cache.entries().next().value;this.cache.delete(ok);URL.revokeObjectURL(ou);}return u;},
  drop(id){for(const k of ["t:"+id,"f:"+id]){if(this.cache.has(k)){URL.revokeObjectURL(this.cache.get(k));this.cache.delete(k);}}},
  async slot(slot,i=0,thumb=false){const ids=DB.ids(slot);if(!ids.length)return null;return this.url(ids[Math.min(i,ids.length-1)],thumb);},
  async slotRand(slot,thumb){const ids=DB.ids(slot);if(!ids.length)return null;return this.url(pick(ids),thumb);},
  // đặt ảnh vào <img>, chỉ hiện khi đã decode xong (mượt)
  async set(el,url){if(!url){el.removeAttribute("src");el.style.visibility="hidden";return false;}
    if(el.src===url){el.style.visibility="";return true;}
    const im=new Image();im.src=url;try{await im.decode();}catch(e){}el.src=url;el.style.visibility="";return true;},
  async preload(slot){for(const id of DB.ids(slot)){const u=await this.url(id);const im=new Image();im.src=u;try{await im.decode();}catch(e){}}},
};
async function processFile(file){
  let bmp;try{bmp=await createImageBitmap(file);}catch(e){const u=URL.createObjectURL(file);const im=new Image();im.src=u;await im.decode();bmp=im;}
  const mk=(max,q)=>{const s=Math.min(1,max/Math.max(bmp.width,bmp.height));const w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);
    return new Promise(r=>c.toBlob(b=>{c.width=c.height=0;r(b);},"image/jpeg",q));};
  const full=await mk(1600,.88),th=await mk(480,.8);if(bmp.close)bmp.close();return {full,th};
}
async function importFiles(slot,files,onp){let n=0;for(const f of files){const {full,th}=await processFile(f);
  const id=slot+"#"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await DB.put({id,slot,blob:full},th);n++;onp&&onp(n,files.length);}}
async function exportPack(){const items=[],blobs=[];for(const [slot,ids] of DB.idx){for(const id of ids){const r=await DB.getRec(id);const t=await DB.get(id,true);if(!r)continue;items.push({id,slot,a:r.blob.size,b:t?t.size:0});blobs.push(r.blob);if(t)blobs.push(t);}}
  const head=new TextEncoder().encode(JSON.stringify({v:1,items}));const len=new Uint32Array([head.length]);
  return new Blob([new TextEncoder().encode("CVPK"),len,head,...blobs],{type:"application/octet-stream"});}
async function importPack(file,onp){const buf=await file.arrayBuffer();const mg=new TextDecoder().decode(buf.slice(0,4));if(mg!=="CVPK")throw "Sai định dạng gói";
  const len=new Uint32Array(buf.slice(4,8))[0];const head=JSON.parse(new TextDecoder().decode(buf.slice(8,8+len)));let off=8+len,n=0;
  for(const it of head.items){const a=new Blob([buf.slice(off,off+it.a)],{type:"image/jpeg"});off+=it.a;const b=new Blob([buf.slice(off,off+it.b)],{type:"image/jpeg"});off+=it.b;await DB.put({id:it.id,slot:it.slot,blob:a},b);n++;onp&&onp(n,head.items.length);}return n;}
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}

let UID=1;
const mkCard=(id,up=0)=>({id,up,u:UID++});
function cdef(c){const d=CARDS[c.id];const fx=c.up&&d.up?{...d.fx,...d.up}:{...d.fx};const cost=(c.up&&d.up&&d.up.c!==undefined)?d.up.c:d.c;return {d,fx,cost};}
function cdesc(c){const {d,fx}=cdef(c);const p=[];const all=fx.all?" lên tất cả":"";
  if(fx.lose)p.push(`Mất ${fx.lose} HP.`);
  if(fx.d)p.push(`Gây ${fx.d+(C&&C.p?C.p.st.s||0:0)}${fx.h>1?"×"+fx.h:""} sát thương${all}.`);
  if(fx.b)p.push(`Nhận ${fx.b} Giáp.`);
  if(fx.v)p.push(`${fx.v} Phơi Yếu${all}.`);if(fx.w)p.push(`${fx.w} Suy Yếu${all}.`);if(fx.bl)p.push(`${fx.bl} Chảy Máu${all}.`);
  if(fx.s)p.push(`+${fx.s} Sức Mạnh.`);if(fx.dr)p.push(`Rút ${fx.dr} lá.`);if(fx.e)p.push(`+${fx.e} Năng Lượng.`);if(fx.hp)p.push(`Hồi ${fx.hp} HP.`);if(fx.th)p.push(`${fx.th} Gai.`);
  if(d.pd)p.push(d.pd.replace("{pv}",fx.pv));if(fx.x)p.push("Tiêu Hao.");return p.join(" ");}
const TYPEN={atk:"Tấn công",skl:"Kỹ năng",pow:"Năng lực",cur:"Lời nguyền"};
function cardHTML(c,extra=""){const {d,cost}=cdef(c);const cls=d.hero?"pact":d.t;const ids=DB.ids("card_"+c.id);
  return `<div class="card ${cls} ${extra}" data-u="${c.u}">${cost>=0?`<div class="cc">${cost}</div>`:""}<div class="art"${ids.length?` data-art="${ids[0]}"`:""}></div><div class="cn ${c.up?"up":""}">${esc(d.n)}${c.up?"+":""}</div><div class="ct">${d.hero?"Khế ước":TYPEN[d.t]}</div><div class="cd">${esc(cdesc(c))}</div></div>`;}
function hydrateArts(root){root.querySelectorAll("[data-art]").forEach(el=>IMG.url(el.dataset.art,true).then(u=>{if(u)el.style.backgroundImage=`url(${u})`;}));}
function cardPool(r){return Object.keys(CARDS).filter(k=>CARDS[k].r===r);}
function rollCard(kind){const x=Math.random();let r=kind==="b"?(x<.5?3:2):kind==="e"?(x<.25?3:x<.7?2:1):(x<.06?3:x<.38?2:1);if(kind==="rare")r=3;return pick(cardPool(r));}
function openDeck(pickMode,cb,filter,oncancel){const list=(R?R.deck:[]).filter(c=>!filter||filter(c));
  const b=modal(pickMode||`Bộ bài (${list.length})`,`<div class="cardgrid">${list.map(c=>cardHTML(c)).join("")}</div>`,oncancel);hydrateArts(b);
  if(cb)b.querySelectorAll(".card").forEach(el=>el.onclick=()=>{const c=R.deck.find(x=>x.u==el.dataset.u);closeModal();cb(c);});}
function openRelics(){modal("Di vật",R.relics.map(k=>`<div class="btn"><b class="gc">${RELICS[k].n}</b><small>${RELICS[k].d}</small></div>`).join("")||"<p class='muted'>Chưa có di vật.</p>");}
function gainRelic(k){if(!k)return;if(k==="rand"){const pool=Object.keys(RELICS).filter(x=>!RELICS[x].start&&!R.relics.includes(x)&&x!=="an_khe");k=pick(pool);if(!k)return;}
  if(R.relics.includes(k))return;R.relics.push(k);const p=RELICS[k].pick;if(p){if(p.maxhp){R.max+=p.maxhp;R.hp+=p.maxhp;}if(p.curse)R.deck.push(mkCard(p.curse));}toast("Nhận di vật: "+RELICS[k].n);}

function heroNext(hid,ctx){const h=HEROES[hid],st=M.heroes[hid];if(st.stage>=5)return null;
  if(ctx==="hub"){if(!(h.hub||(st.stage>=1&&!h.noHub)))return null;}
  else if(ctx==="shop"){if(!h.shop)return null;}
  else {if(h.hub||h.shop||!h.acts.includes(R.act))return null;}
  const req=st.stage<3?h.ev[st.stage].req:st.stage===3?55:80;if(st.aff<req)return null;
  if(st.stage>=3&&!st.path)return null;return {hid,stage:st.stage};}
function heroAff(hid,n){const st=M.heroes[hid];st.aff=Math.max(0,Math.min(100,st.aff+n));}
async function playHeroEvent(hid){const h=HEROES[hid],st=M.heroes[hid];const s=st.stage;
  if(s<3){const ev=h.ev[s];const res=await vn({slot:hid+"_ev"+s,fb:hid+"_portrait",name:h.n,lines:ev.lines,choices:ev.ch.map(c=>({t:c.t,dis:c.need&&!meetNeed(c.need)}))});
    const c=ev.ch[res];st.met=1;if(c.aff)heroAff(hid,c.aff);if(c.corr)addCorr(c.corr);if(c.hp&&R){R.hp=Math.min(R.max,R.hp+c.hp);if(R.hp<1)R.hp=1;}if(c.gold&&R)R.gold=Math.max(0,R.gold+c.gold);
    if(c.card&&R){const id=c.card==="rare"?rollCard("rare"):c.card;R.deck.push(mkCard(id));toast("Nhận thẻ: "+CARDS[id].n);}if(c.relic&&R)gainRelic(c.relic);
    if(c.path)st.path=c.path;if(!c.stay)st.stage=s+1;
    if(c.r)await vn({slot:hid+"_ev"+s,fb:hid+"_portrait",name:h.n,lines:[c.r]});
    toast(`${h.n}: thiện cảm ${st.aff}`);}
  else if(s===3){const sc=h.s1[st.path];const sid=hid+"_s1_"+st.path;await vn({slot:sid,name:h.n,title:sc.n,lines:sc.lines});M.gal[sid]=1;st.stage=4;heroAff(hid,5);if(R)R.hp=Math.min(R.max,R.hp+Math.round(R.max*.25));toast("Đã mở khóa Hồi Ức: "+sc.n);}
  else if(s===4){const sid=hid+"_s2";await vn({slot:sid,fb:hid+"_s1_"+st.path,name:h.n,title:h.s2.n,lines:h.s2.lines});M.gal[sid]=1;st.stage=5;if(!M.pacts.includes(h.s2.card))M.pacts.push(h.s2.card);if(R)R.deck.push(mkCard(h.s2.card));toast("Khế ước! Thẻ "+CARDS[h.s2.card].n+" luôn có trong bộ bài khởi đầu.",2600);}
  save();}
function meetNeed(n){if(!R)return true;if(n.gold&&R.gold<n.gold)return false;if(n.hp&&R.hp<n.hp)return false;return true;}
function addCorr(n){M.corr=Math.max(0,Math.min(100,M.corr+n));}

function vn(o){return new Promise(async res=>{closeModal();show("vn");const sc=$("#vn");sc.classList.remove("hide");

  const urls=[];for(let i=0;i<ids.length;i++)urls[i]=IMG.url(ids[i]);
  async function showImg(k){if(!ids.length||k===curImg)return;curImg=k;const u=await urls[k];const back=front===A?B:A;await IMG.set(back,u);back.classList.add("on");front.classList.remove("on");front=back;}
  let i=0,typing=null;const box=sc.querySelector(".vbox"),nm=sc.querySelector(".vname"),tx=sc.querySelector(".vtext"),chd=sc.querySelector(".vch"),nx=sc.querySelector(".vnext");
  function line(){chd.innerHTML="";let L=o.lines[i];const H=o.H||"";L=L.replace(/\{H\}/g,H);const nar=L[0]==="~";const t=nar?L.slice(1):L;
    nm.textContent=nar?(i===0&&o.title?"— "+o.title+" —":""):(o.name||"");tx.className="vtext"+(nar?" nar":"");
    showImg(ids.length?Math.min(ids.length-1,Math.floor(i*ids.length/n)):0);

    nx.style.display="none";
    function after(){if(i===n-1&&o.choices){nx.style.display="none";chd.innerHTML=o.choices.map((c,j)=>`<button class="btn ${c.hot?"hot":""} ${c.dis?"dis":""}" data-j="${j}">${esc(c.t)}</button>`).join("");
        chd.querySelectorAll("button").forEach(b=>b.onclick=e=>{e.stopPropagation();VN=null;res(+b.dataset.j);});}else nx.style.display="block";}
    tx._full=t;}
  VN={tap(){if(typing){clearInterval(typing);typing=null;tx.textContent=tx._full;if(i===n-1&&o.choices){line_after();}else nx.style.display="block";return;}
      if(i===n-1&&o.choices)return;if(i<n-1){i++;line();}else{VN=null;res(-1);}}};

const NODE={combat:["⚔","Giao Chiến","Kẻ thù thường"],elite:["☠","Tinh Anh","Nguy hiểm — phần thưởng lớn"],event:["?","Sự Kiện","Điều chưa biết"],rest:["🔥","Lửa Trại","Nghỉ ngơi, rèn, gặp gỡ"],shop:["⚖","Thương Nhân","Mira và hàng hóa"],treasure:["◆","Kho Báu","Một di vật"],hero:["♥","Bóng Hình","Ai đó đang chờ ngươi"],boss:["♛","Chúa Tể","Kẻ cai quản tầng này"]};
function startRun(){M.runs++;M.visit++;const max=70+upg("maxhp")*6;
  R={act:1,floor:0,hp:max,max,gold:99+upg("gold")*30,souls:0,deck:[...STARTER,...M.pacts].map(id=>mkCard(id)),relics:["estus"],opts:null,heroDone:{}};
  if(upg("relic"))gainRelic("rand");R.opts=genOpts();save();showMap();}
function heroRunAvail(){return HERO_ORDER.filter(h=>!R.heroDone[h]&&heroNext(h,"run"));}
function genOpts(){const f=R.floor+1;if(f===8)return ["boss"];if(f===1)return ["combat","combat"];
  const w=[["combat",40],["event",20],["elite",f>=3?13:0],["rest",f>=3?11:0],["shop",f>=2?9:0],["treasure",4],["hero",heroRunAvail().length?16:0]];
  const cnt=Math.random()<.5?2:3,out=[];let guard=0;while(out.length<cnt&&guard++<50){let tot=w.reduce((a,b)=>a+b[1],0),x=Math.random()*tot,t;for(const [k,v] of w){x-=v;if(x<0){t=k;break;}}if(!out.includes(t)||t==="combat"&&out.filter(o=>o==="combat").length<1)out.push(t);}
  if(f===7&&!out.includes("rest"))out[0]="rest";return out;}
async function showMap(){show("map");const s=$("#map");await bgSet("map","bg_act"+R.act);
  s.querySelector(".mc").innerHTML=topBar()+`<div class="pad" style="padding-bottom:0"><div class="muted">Màn ${R.act}${M.ng?" · NG+"+M.ng:""}</div><h2 style="margin:2px 0">${ACTS[R.act]}</h2></div>
   <div class="floorbar">${[1,2,3,4,5,6,7,8].map(i=>`<i class="${i<=R.floor?"on":""} ${i===R.floor+1?"cur":""}"></i>`).join("")}</div>
   <div class="relics">${R.relics.map(k=>`<span class="relic">${RELICS[k].n}</span>`).join("")}</div>
   <div class="scroll"><div class="pad muted" style="padding-bottom:0">Tầng ${R.floor+1}/8 — chọn lối đi:</div><div class="doors">${R.opts.map((o,i)=>`<button class="door ${o}" data-i="${i}"><span class="di">${NODE[o][0]}</span><span><b class="serif" style="font-size:18px">${NODE[o][1]}</b><br><span class="muted">${NODE[o][2]}</span></span></button>`).join("")}</div>
   <div class="pad"><button class="btn" onclick="abandon()">Bỏ cuộc hành trình<small>Trở về Lò Lửa, giữ 50% linh hồn</small></button></div></div>`;
  s.querySelectorAll(".door").forEach(b=>b.onclick=()=>enterNode(R.opts[+b.dataset.i]));}
async function abandon(){if(!confirm("Bỏ cuộc hành trình này?"))return;await runEnd(false,true);}
async function nodeDone(){C=null;R.floor++;if(R.floor>=8){R.act++;R.floor=0;if(R.act>3)return;R.hp=Math.min(R.max,R.hp+Math.round(R.max*.3));toast("Tiến vào: "+ACTS[R.act],2200);}
  R.opts=genOpts();save();showMap();}
async function enterNode(t){
  if(t==="combat"){const g=pick(POOLS[R.act].n);return combat(g,"n");}
  if(t==="elite")return combat(pick(POOLS[R.act].e),"e");
  if(t==="boss")return combat([POOLS[R.act].b],"b");
  if(t==="event")return doEvent();
  if(t==="rest")return doRest();
  if(t==="shop")return doShop();
  if(t==="treasure"){gainRelic("rand");const g=rnd(20,40);R.gold+=g;await vn({slot:"evt_mimic",lines:["~Một rương cổ nằm lặng lẽ. Bên trong là một di vật và "+g+" vàng."]});return nodeDone();}
  if(t==="hero"){const av=heroRunAvail();if(!av.length)return doEvent();const h=pick(av);R.heroDone[h]=1;await playHeroEvent(h);return nodeDone();}}
async function doEvent(){const pool=EVENTS.filter(e=>e.acts.includes(R.act));const ev=pick(pool);

let C=null;
function mkEnemy(id){const d=ENEMIES[id];const sc=1+.12*M.ng;const hp=Math.round(rnd(d.hp[0],d.hp[1])*sc);return {id,d,hp,max:hp,blk:0,st:{},mi:d.boss||d.elite?0:rnd(0,d.moves.length-1),intent:null,enr:0,u:UID++};}
async function combat(group,kind){closeModal();C={kind,en:group.map(mkEnemy),hand:[],draw:shuffle(R.deck.map(c=>({...c}))),disc:[],exh:[],energy:0,turn:0,p:{blk:0,st:{}},sel:null,busy:false,saved:0};

function pickIntent(e){const m=e.d.moves[e.mi%e.d.moves.length];e.mi++;e.intent=m;}
function intentHTML(e){const m=e.intent;if(!m)return"";if(m.d){const v=calcE(e,m.d);return `<div class="intent atk">⚔ ${v}${m.h>1?"×"+m.h:""}</div>`;}
  if(m.b&&!m.w&&!m.v)return `<div class="intent def">🛡 ${m.b}${m.s?" ▲":""}</div>`;if(m.s&&!m.w)return `<div class="intent buf">▲ Cường hóa</div>`;return `<div class="intent dbf">☣ Nguyền</div>`;}

function calcE(e,base){let v=base+(e.st.s||0)+M.ng;if(e.st.w)v*=.75;if(C.p.st.v)v*=1.5;return Math.max(0,Math.floor(v));}
function stsHTML(st,blk){const L=[];if(blk)L.push(`<span class="st b">🛡${blk}</span>`);const nm={s:"Lực",v:"Phơi",w:"Yếu",bl:"Máu",th:"Gai",metal:"Thép",bleedAura:"Ấn",blood:"Khế"};

async function renderCombat(full){const s=$("#combat");

  const hd=s.querySelector(".hand");hd.innerHTML=`<div class="hint">${C.sel?(needT(C.sel)?"Chạm kẻ thù để dùng":"Chạm lại lá bài để dùng"):""}</div>`+C.hand.map(c=>cardHTML(c,(C.sel===c?"sel ":"")+(canPlay(c)?"":"no"))).join("");
  const n=C.hand.length,W=hd.clientWidth-12,cw=100;const ov=n>1&&n*cw>W?(n*cw-W)/(n-1):-4;hd.querySelectorAll(".card").forEach((el,i)=>{el.style.margin=`0 ${-ov/2}px`;el.onclick=()=>onCardTap(C.hand.find(c=>c.u==el.dataset.u));});

function canPlay(c){const {d,cost}=cdef(c);return !d.fx.unpl&&cost<=C.energy;}
function needT(c){const {fx}=cdef(c);if(fx.all)return false;return !!(fx.d||fx.v||fx.w||fx.bl||fx.sp)&&C.en.filter(e=>e.hp>0).length>1;}

async function playCard(c,target){const {d,fx,cost}=cdef(c);if(cost>C.energy)return;C.busy=true;C.sel=null;C.energy-=cost;C.hand.splice(C.hand.indexOf(c),1);

  toast(`Linh hồn mang về: ✦ ${keep}`,2600);showHub();}
async function finalBoss(){const nyx=M.heroes.nyx;const best=HERO_ORDER.filter(h=>h!=="nyx").sort((a,b)=>M.heroes[b].aff-M.heroes[a].aff)[0];const many=HERO_ORDER.filter(h=>h!=="nyx"&&M.heroes[h].aff>=80).length;
  const ch=[{t:"Thắp lại Ngọn Lửa"},{t:"Để Ngọn Lửa tàn — ngồi lên ngai",dis:M.corr<50},{t:"Chìa tay cho Nyx ♥",dis:nyx.stage<4,hot:1},{t:"Mang ngọn lửa về cho tất cả bọn họ ♥",dis:many<4,hot:1}];
  const r=await vn({slot:"en_nyx",name:"Nyx",lines:["~Nyx gục xuống bên ngai xương, đôi cánh rách nát.","Vậy là… ngươi đến được đây rồi. Giờ thì chọn đi, Kẻ Tro Tàn.","~(Mở khóa: Bóng Tối cần Ô Uế ≥ 50 · Nyx cần cảnh thân mật với nàng · Hậu cung cần 4 nữ nhân thiện cảm ≥ 80)"],choices:ch});
  const key=["end_flame","end_dark","end_nyx","end_harem"][r];const E=ENDINGS[key];
  await vn({slot:key,title:E.n,lines:E.lines});M.gal[key]=1;M.ends[key]=1;
  if(key==="end_flame"&&M.heroes[best].aff>=60){await vn({slot:best+"_end",fb:best+"_portrait",name:HEROES[best].n,lines:HEROES[best].end});M.gal[best+"_end"]=1;}
  if(key==="end_nyx"){await vn({slot:"nyx_end",fb:"nyx_portrait",name:"Nyx",lines:HEROES.nyx.end});M.gal.nyx_end=1;}
  M.wins++;M.ng++;await vn({slot:"bg_title",lines:[`~KẾT THÚC: ${E.n}. Vòng lặp mới bắt đầu (NG+${M.ng}) — kẻ thù mạnh hơn, nhưng các nàng vẫn nhớ ngươi.`]});
  await runEnd(true);}

// ---------------- HUB ----------------
async function showHub(){show("hub");await bgSet("hub","bg_hub");
  if(!M.intro){M.intro=1;save();await playHeroEvent("sera");return showHub();}
  const pend=HERO_ORDER.filter(h=>heroNext(h,"hub")).length;
  $("#hub .mc").innerHTML=`<div class="top"><span class="sc">✦ Linh hồn <b>${M.souls}</b></span><span class="cc">◈ Ô uế <b>${M.corr}</b></span><span class="sp"></span>${M.ng?`<span class="pill">NG+${M.ng}</span>`:""}</div>
   <div class="scroll"><div class="pad"><h1 class="serif" style="font-size:30px">Lò Lửa Cuối Cùng</h1><div class="muted">Nơi Kẻ Tro Tàn trở về sau mỗi lần gục ngã.</div>
   ${R?`<button class="btn main" onclick="showMap()">Tiếp tục hành trình<small>Màn ${R.act} · Tầng ${R.floor+1}</small></button>`:`<button class="btn main" onclick="startRun()">Xuống Vực Thẳm<small>Bắt đầu một cuộc hành trình mới</small></button>`}
   <button class="btn ${pend?"hot":""}" onclick="showHeroes()">Nữ Nhân ${pend?"♥ "+pend:""}<small>Trò chuyện, tặng quà, sự kiện</small></button>
   <button class="btn" onclick="showUpg()">Thăng Hoa<small>Dùng linh hồn để mạnh hơn vĩnh viễn</small></button>
   <button class="btn" onclick="showGallery()">Hồi Ức<small>Xem lại các cảnh đã mở khóa</small></button>
   <button class="btn" onclick="showStudio()">Xưởng Ảnh<small>Thêm ảnh của bạn vào game + prompt</small></button>
   <button class="btn" onclick="showSettings()">Cài đặt</button>
   <div class="muted" style="margin-top:8px">Hành trình: ${M.runs} · Chiến thắng: ${M.wins} · Kết thúc: ${Object.keys(M.ends).length}/4</div></div></div>`;}
function showHeroes(){const b=modal("Nữ Nhân",HERO_ORDER.map(hid=>{const h=HEROES[hid],st=M.heroes[hid];if(!st.met&&!h.hub)return `<div class="hcard"><div class="hp empty">?</div><div><h3>???</h3><div class="muted">Chưa gặp</div></div></div>`;
  const nx=heroNext(hid,"hub");const ids=DB.ids(hid+"_portrait");
  return `<div class="hcard" data-h="${hid}"><div class="hp ${ids.length?"":"empty"}">${ids.length?`<img data-id="${ids[0]}">`:"trống"}</div><div style="flex:1"><h3>${h.n} ${nx?"<span style='color:#ff7fb0'>♥</span>":""}</h3><div class="muted">${h.title} · ${h.age} tuổi${st.path?` · ${st.path==="love"?"Tình":"Sa ngã"}`:""}</div><div class="aff"><i style="width:${st.aff}%"></i></div><div class="muted">Thiện cảm ${st.aff}/100 · Chặng ${Math.min(st.stage,5)}/5</div></div></div>`;}).join("")+`<p class="muted">Thiện cảm 55 → cảnh thân mật · 80 → Khế ước (thẻ bài vĩnh viễn). Lựa chọn tại Ngã rẽ quyết định nhánh Tình hay Sa ngã.</p>`);
  lazyThumbs(b);b.querySelectorAll("[data-h]").forEach(el=>el.onclick=()=>heroDetail(el.dataset.h));}
function heroDetail(hid){const h=HEROES[hid],st=M.heroes[hid];const nx=heroNext(hid,"hub");const canTalk=!M.talked[hid]&&!h.noHub,canGift=!M.gifted[hid]&&M.souls>=30&&!h.noHub;
  const b=modal(h.n,`<div class="muted">${h.title} · ${h.age} tuổi</div><p>${h.desc}</p><div class="aff"><i style="width:${st.aff}%"></i></div><div class="muted">Thiện cảm ${st.aff}/100</div>
   ${nx?`<button class="btn hot" id="hev">${["Gặp gỡ","Thân thiết","Ngã rẽ","Cảnh thân mật","Khế ước"][st.stage]} ♥</button>`:""}
   ${h.noHub?`<p class="muted">Nàng chỉ xuất hiện trong giấc mơ, ở Vực Thẳm.</p>`:`<button class="btn ${canTalk?"":"dis"}" id="htk">Trò chuyện (+4)</button><button class="btn ${canGift?"":"dis"}" id="hgf">Tặng Than Hồng (✦30, +8)</button>`}
   <p class="muted">${!nx&&st.stage<5?(st.stage<3?`Sự kiện kế tiếp cần thiện cảm ${h.ev[st.stage].req}`:st.stage===3?"Cảnh thân mật cần thiện cảm 55":"Khế ước cần thiện cảm 80")+(h.hub||st.stage>=1?"":" · gặp nàng trong hành trình"):""}${!h.hub&&!h.shop&&st.stage<3&&st.met?" · sự kiện của nàng cũng xảy ra trong hành trình (Màn "+h.acts.join(", ")+")":""}</p>`);
  if(nx)$("#hev").onclick=async()=>{closeModal();await playHeroEvent(hid);showHub();};
  if(!h.noHub){$("#htk").onclick=async()=>{M.talked[hid]=1;heroAff(hid,4);save();closeModal();await vn({slot:hid+"_portrait",name:h.n,lines:[pick(h.talk)]});showHub();};
    $("#hgf").onclick=()=>{M.souls-=30;M.gifted[hid]=1;heroAff(hid,8);save();toast(h.n+" mỉm cười. Thiện cảm "+st.aff);heroDetail(hid);};}}
function showUpg(){const b=modal("Thăng Hoa — ✦ "+M.souls,Object.entries(UPGRADES).map(([k,u])=>{const l=upg(k);const c=u.cost[l];return `<button class="btn ${l>=u.max||M.souls<c?"dis":""}" data-k="${k}"><b>${u.n}</b> ${"●".repeat(l)}${"○".repeat(u.max-l)}<small>${u.d}${l<u.max?" — ✦ "+c:" — tối đa"}</small></button>`;}).join(""));
  b.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{const k=el.dataset.k,u=UPGRADES[k],c=u.cost[upg(k)];if(M.souls<c)return;M.souls-=c;M.upg[k]=upg(k)+1;save();showUpg();showHub();});}
function galleryList(){const L=[];for(const hid of HERO_ORDER){const h=HEROES[hid];L.push({id:hid+"_s1_love",n:h.n+" · "+h.s1.love.n,lines:h.s1.love.lines,name:h.n},{id:hid+"_s1_dark",n:h.n+" · "+h.s1.dark.n,lines:h.s1.dark.lines,name:h.n},{id:hid+"_s2",n:h.n+" · "+h.s2.n,lines:h.s2.lines,name:h.n},{id:hid+"_end",n:h.n+" · Kết thúc",lines:h.end,name:h.n});}
  for(const [id,s] of Object.entries(MON_SCENES))L.push({id,n:s.n,lines:s.lines,name:ENEMIES[s.who].n});for(const [id,s] of Object.entries(EV_SCENES))L.push({id,n:s.n,lines:s.lines,name:""});for(const [id,s] of Object.entries(ENDINGS))L.push({id,n:s.n,lines:s.lines,name:""});return L;}
function showGallery(){const L=galleryList();const un=L.filter(x=>M.gal[x.id]).length;
  const b=modal(`Hồi Ức ${un}/${L.length}`,`<div class="gal">${L.map((x,i)=>{const ok=M.gal[x.id];const ids=DB.ids(x.id);return `<div class="gi" data-i="${i}">${ok&&ids.length?`<img data-id="${ids[0]}">`:""}<span>${ok?esc(x.n):"???"}</span></div>`;}).join("")}</div>`);lazyThumbs(b);
  b.querySelectorAll(".gi").forEach(el=>el.onclick=async()=>{const x=L[+el.dataset.i];if(!M.gal[x.id])return toast("Chưa mở khóa");closeModal();await vn({slot:x.id,name:x.name,title:x.n,lines:x.lines,H:"nàng"});showHub();});}
function showSettings(){const b=modal("Cài đặt",`<button class="btn" id="tw">Hiệu ứng chữ chạy: <b>${M.set.tw?"Bật":"Tắt"}</b></button>
  <div class="btn"><b>Chơi toàn màn hình trên iPhone</b><small>Mở file trong Safari → nút Chia sẻ → “Thêm vào Màn hình chính”. Mở từ biểu tượng ngoài màn hình chính sẽ ẩn thanh trình duyệt.</small></div>
  <button class="btn" id="rst">Xóa dữ liệu tiến trình<small>Giữ nguyên ảnh trong Xưởng Ảnh</small></button>`);
  $("#tw").onclick=()=>{M.set.tw=M.set.tw?0:1;save();showSettings();};$("#rst").onclick=()=>{if(confirm("Xóa toàn bộ tiến trình? (ảnh vẫn giữ)")){M=newMeta();R=null;save();closeModal();showHub();}};}

// ---------------- STUDIO ----------------
let studioGroup=null;
async function showStudio(){const groups=[...new Set(SLOTS.map(s=>s.g))];const tot=[...DB.idx.values()].reduce((a,b)=>a+b.length,0);
  let est="";try{const e=await navigator.storage.estimate();est=` · dùng ${(e.usage/1048576).toFixed(0)} MB`;}catch(e){}
  const b=modal("Xưởng Ảnh",`<div class="muted">${tot} ảnh${est}. Ảnh được nén & lưu trong máy. Mỗi ô có thể có nhiều ảnh: cảnh nhiều ảnh sẽ tự chuyển theo lời thoại, ảnh chân dung/kẻ thù sẽ chọn ngẫu nhiên.</div>
   <div class="row" style="flex-wrap:wrap;gap:6px;margin:8px 0"><button class="pill" id="exp">⇩ Xuất gói ảnh</button><button class="pill" id="imp">⇧ Nhập gói ảnh</button><button class="pill" id="ptx">⇩ Danh sách prompt .txt</button></div>
   <div class="muted">Prompt dùng cho WAI-Illustrious v17 · kích thước gợi ý ${SLOT_SIZE} · Euler a, 28 bước, CFG 5–6.</div>
   ${groups.map(g=>{const ss=SLOTS.filter(s=>s.g===g);const n=ss.reduce((a,s)=>a+DB.ids(s.id).length,0);return `<button class="btn" data-g="${esc(g)}"><b>${esc(g)}</b><small>${ss.length} ô · ${n} ảnh · ${ss.filter(s=>!DB.ids(s.id).length).length} ô trống</small></button>`;}).join("")}`);
  b.querySelectorAll("[data-g]").forEach(el=>el.onclick=()=>studioG(el.dataset.g));
  $("#exp").onclick=async()=>{toast("Đang đóng gói…");download(await exportPack(),"cinderveil_anh.cvpk");};
  $("#imp").onclick=()=>pickFiles(false,async fs=>{try{const n=await importPack(fs[0],(a,t)=>toast(`Nhập ${a}/${t}`));toast("Đã nhập "+n+" ảnh");showStudio();}catch(e){toast(""+e);}},".cvpk,application/octet-stream,*/*");
  $("#ptx").onclick=()=>{const t=SLOTS.map(s=>`### [${s.id}] ${s.g} — ${s.n}${s.note?"\n# "+s.note:""}\nPOSITIVE: ${s.pos}\nNEGATIVE: ${s.neg}\n`).join("\n");download(new Blob([t],{type:"text/plain"}),"cinderveil_prompts.txt");};}
function pickFiles(multi,cb,accept="image/*"){const i=document.createElement("input");i.type="file";i.accept=accept;i.multiple=multi;i.onchange=()=>{if(i.files.length)cb([...i.files]);};i.click();}
function studioG(g){studioGroup=g;const ss=SLOTS.filter(s=>s.g===g);
  const b=modal(g,`<button class="pill" id="back">← Nhóm khác</button>`+ss.map(s=>{const ids=DB.ids(s.id);return `<div class="slotrow" data-s="${s.id}"><div class="row"><div style="flex:1"><b>${esc(s.n)}</b><div class="muted" style="font-size:11px">${s.id} · ${ids.length} ảnh</div></div><button class="pill" data-p="${s.id}">Prompt</button><button class="pill" style="color:var(--ember2);border-color:var(--ember)" data-a="${s.id}">+ Ảnh</button></div>
    <div class="thumbs">${ids.map(id=>`<img data-id="${id}" data-v="${id}">`).join("")}</div></div>`;}).join(""));
  lazyThumbs(b);$("#back").onclick=showStudio;
  b.querySelectorAll("[data-a]").forEach(el=>el.onclick=()=>pickFiles(true,async fs=>{await importFiles(el.dataset.a,fs,(a,t)=>toast(`Đang xử lý ${a}/${t}…`,4000));toast("Đã thêm "+fs.length+" ảnh");studioG(g);}));
  b.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>promptView(el.dataset.p));
  b.querySelectorAll("[data-v]").forEach(el=>el.onclick=()=>imgView(el.dataset.v));}
function promptView(id){const s=SLOT_BY_ID[id];const b=modal("Prompt · "+s.n,`${s.note?`<div class="pill" style="margin-bottom:8px;color:#ff9cc3">${esc(s.note)}</div>`:""}<div class="muted">Dương (Positive)</div><textarea rows="8" id="pp">${esc(s.pos)}</textarea><button class="btn" id="cp">Sao chép Positive</button>
  <div class="muted">Âm (Negative)</div><textarea rows="5" id="pn">${esc(s.neg)}</textarea><button class="btn" id="cn">Sao chép Negative</button><div class="muted">Kích thước: ${SLOT_SIZE}</div><button class="btn main" id="bk">← Quay lại</button>`);
  const cp=t=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Đã sao chép"),()=>{toast("Giữ và chọn văn bản để sao chép");});};
  $("#cp").onclick=()=>cp(s.pos);$("#cn").onclick=()=>cp(s.neg);$("#bk").onclick=()=>studioG(studioGroup||s.g);}
async function imgView(id){const b=modal("Ảnh",`<img id="iv" style="width:100%;border-radius:8px"><button class="btn" id="dl">Xóa ảnh này</button><button class="btn main" id="bk">← Quay lại</button>`);await IMG.set($("#iv"),await IMG.url(id));
  $("#dl").onclick=async()=>{if(!confirm("Xóa ảnh?"))return;await DB.del(id);studioG(studioGroup);};$("#bk").onclick=()=>studioG(studioGroup);}

// ---------------- BOOT ----------------
async function boot(){load();try{await DB.open();await DB.loadIndex();}catch(e){toast("Không mở được bộ nhớ ảnh");}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  const t=$("#title");for(let i=0;i<14;i++){const e=document.createElement("i");e.className="ember";e.style.left=rnd(2,98)+"%";e.style.setProperty("--dx",rnd(-60,60)+"px");e.style.animationDuration=rnd(6,13)+"s";e.style.animationDelay=(-rnd(0,12))+"s";t.appendChild(e);}
  await bgSet("title","bg_title");show("title");
  $("#vn").addEventListener("click",e=>{if(e.target.closest(".vtools")||e.target.closest(".vch"))return;if($("#vn").classList.contains("hide")){$("#vn").classList.remove("hide");return;}if(VN)VN.tap();});
  $("#vhide").onclick=()=>$("#vn").classList.toggle("hide");$("#vfit").onclick=()=>$("#vn").classList.toggle("fit");
  $("#tstart").onclick=()=>showHub();
  document.addEventListener("gesturestart",e=>e.preventDefault());}
window.addEventListener("load",boot);

</script></body></html>
